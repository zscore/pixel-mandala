<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dff4ff">
<title>Marble Cascade</title>
<style>
  :root { --bg: #dff4ff; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body {
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  canvas {
    height: min(96vh, calc(96vw * 16 / 9));
    height: min(96dvh, calc(96vw * 16 / 9));
    aspect-ratio: 9 / 16;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    box-shadow: 0 0 60px rgba(80, 180, 255, .35);
    cursor: none;
    touch-action: none;
  }
  /* phones: fill the screen edge to edge; the letterbox is the same color as the scene's background */
  @media (max-width: 600px), (pointer: coarse) {
    canvas { height: min(100vh, calc(100vw * 16 / 9)); height: min(100dvh, calc(100vw * 16 / 9)); box-shadow: none; }
  }
</style>
</head>
<body>
<canvas id="c" title="drag a part to turn it · space to pause"></canvas>
<script>
const W = 360, H = 1280, CX = 180, N = W * H * 4;
const VIEW = 640;      // the canvas is a 9:16 window onto the 9:32 cathedral front, panned up and down by the show
const POOL = 1236;     // water surface of the lake
const FY = POOL - 594; // the fountain's parts are laid out from the lake up
const FULL = new URLSearchParams(location.search).get('view') === 'full'; // ?view=full shows the whole front at once
let vy0 = 0, vy1 = H;  // the rows in view this frame
const canvas = document.getElementById('c');
canvas.width = W; canvas.height = FULL ? H : VIEW;
if (FULL) canvas.style.aspectRatio = '9 / 32';
const ctx = canvas.getContext('2d');
const img = ctx.createImageData(W, H);
const O = img.data; // composited output
let T = null;       // layer buffer currently being drawn into
let drawOn = true;  // false on simulation steps that won't be shown: shapes only write the collision mask

// ---------- utils ----------
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const lerp = (a, b, k) => a + (b - a) * k;
const lerpC = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const mod = (a, n) => ((a % n) + n) % n;
const MX = x => 2 * CX - x; // mirror across the center column

function h2(x, y) {
  let n = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = h2(xi, yi), b = h2(xi + 1, yi), c = h2(xi, yi + 1), d = h2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, y) => vnoise(x, y) * .5 + vnoise(x * 2.1, y * 2.1) * .3 + vnoise(x * 4.3, y * 4.3) * .2;
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => v / 16 - .5);

// "over" blend into the current layer buffer (straight alpha)
function mix(x, y, c, a = 1) {
  x |= 0; y |= 0;
  if (x < 0 || y < 0 || x >= W || y >= H || a <= 0) return;
  const i = (y * W + x) << 2, oa = T[i + 3] / 255;
  if (a >= 1 || oa === 0) { T[i] = c[0]; T[i + 1] = c[1]; T[i + 2] = c[2]; T[i + 3] = (a > 1 ? 1 : a) * 255; return; }
  const na = a + oa * (1 - a), k = a / na;
  T[i] += (c[0] - T[i]) * k; T[i + 1] += (c[1] - T[i + 1]) * k; T[i + 2] += (c[2] - T[i + 2]) * k; T[i + 3] = na * 255;
}
const put = (x, y, c) => mix(x, y, c, 1);
function line(x0, y0, x1, y1, c, a) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (let n = 0; n < 2000; n++) {
    mix(x0, y0, c, a);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}

// ---------- palette ----------
// heaven in white marble: cyan-shaded stone, gold trim, vivid blue water
const C = {
  ink: hex('#1f4a66'), inkRim: hex('#6fb4cc'), shine: hex('#ffffff'), gold: hex('#ffd23f'),
  goldDk: hex('#c8901a'), goldLt: hex('#fff3a8'), deep: hex('#2a6a88'), white: hex('#ffffff'), mist: hex('#ffffff'),
  stone0: hex('#bfe6ee'), stone1: hex('#f2fcfd'), stone2: hex('#d8f2f6'), stoneTop: hex('#ffffff'),
  foam: hex('#e8fcff'), facet0: hex('#cdeef4'), facet1: hex('#f4fdfe'), cloud: hex('#f4fbff'), cloudSh: hex('#cfe8f8'),
  evil: hex('#ff3d8b'),
};
const WATER = ['#0a5fd0', '#1384ec', '#1fa6f8', '#3cc4ff', '#7fdcff', '#c2f2ff', '#f0fdff'].map(hex);
const RAIN = ['#ffd23f', '#7fdcff', '#fff3a8', '#3cc4ff'].map(hex); // motes of gold and blue drifting up
const NEON = ['#ffffff', '#bff4ff', '#fff3a8', '#e0fbff'].map(hex); // sunlit glints in the streams
const GILT = ['#a8781e', '#e0b040', '#fff1b8', '#c8962e'].map(hex);
const GEM_TOP = ['#f0fff6', '#b8f5d0', '#6fe0a0', '#2fb878', '#a0f0d8'].map(hex);
const GEM_SIDE = ['#e8fffc', '#a8f0ec', '#5fd6d6', '#2a9fb0', '#7fe8c8'].map(hex);
const GEM_LIP = ['#fff6d8', '#ffe08a', '#f0c040', '#7fe8c0', '#3fb890'].map(hex);
// marble: one 256² tile of veined stone, read in each shape's own coordinates so the veins turn with it
const MARB = ['#ffffff', '#e8f8fb', '#c4ecf2', '#94d4e2', '#ffffff'].map(hex);
const marbTex = new Uint8Array(256 * 256);
for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++) {
  const k = Math.abs(Math.sin((fbm(x * .035, y * .035) * 5 + x * .012 + y * .02) * Math.PI));
  marbTex[y * 256 + x] = k < .05 ? 3 : k < .14 ? 2 : vnoise(x * .2, y * .2) < .3 ? 1 : h2(x, y) < .02 ? 4 : 0;
}
const marble = (u, v, seed = 0) => MARB[marbTex[((Math.round(v) + 128 + seed * 7) & 255) * 256 + ((Math.round(u) + 128 + seed * 11) & 255)]];
// a band of gold light sweeping across all the stone (SHOW.glint is its position, or < 0 when there's none)
const glint = (x, y, c) => { const d = Math.abs(x + y * .6 - SHOW.glint); return d < 5 ? lerpC(c, C.goldLt, .75 * (1 - d / 5)) : c; };

// ============================================================
// SHAPES — every piece of the temple is a shape in its own local
// coordinates, rasterized each frame with a rotation. Every shape
// also writes the collision mask the water reads.
// ============================================================
const mask = new Uint8Array(W * H);
function raster(x0, y0, ang, R, col) {
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const xa = Math.max(0, Math.floor(x0 - R)), xb = Math.min(W - 1, Math.ceil(x0 + R));
  const ya = Math.max(0, Math.floor(y0 - R)), yb = Math.min(H - 1, Math.ceil(y0 + R));
  for (let y = ya; y <= yb; y++) for (let x = xa; x <= xb; x++) {
    const dx = x - x0, dy = y - y0, c = col(dx * ca + dy * sa, -dx * sa + dy * ca);
    if (!c) continue;
    mask[y * W + x] = 1;
    if (drawOn && y >= vy0 && y < vy1) put(x, y, SHOW.glint >= 0 ? glint(x, y, c) : c);
  }
}
// parts that never move are worked out once, then copied into the mask (and the layer, where in view) each step
const stills = new Map();
function still(key, x0, y0, R, col, isSolid = true) {
  let S = stills.get(key);
  if (!S) {
    S = { px: [], cs: [] };
    const xa = Math.max(0, Math.floor(x0 - R)), xb = Math.min(W - 1, Math.ceil(x0 + R)), ya = Math.max(0, Math.floor(y0 - R)), yb = Math.min(H - 1, Math.ceil(y0 + R));
    for (let y = ya; y <= yb; y++) for (let x = xa; x <= xb; x++) { const c = col(x - x0, y - y0); if (c) { S.px.push(y * W + x); S.cs.push(c); } }
    stills.set(key, S);
  }
  const { px, cs } = S, g = SHOW.glint >= 0;
  for (let k = 0; k < px.length; k++) {
    const i = px[k], y = (i / W) | 0;
    if (isSolid) mask[i] = 1;
    if (drawOn && y >= vy0 && y < vy1) { const x = i % W; put(x, y, g ? glint(x, y, cs[k]) : cs[k]); }
  }
}
const toScreen = (x0, y0, ang, u, v) => [x0 + u * Math.cos(ang) - v * Math.sin(ang), y0 + u * Math.sin(ang) + v * Math.cos(ang)];
const edgeD = (u, v, r) => r + .35 - Math.abs(u) - Math.abs(v); // distance inside a diamond's edge

// a marble slab with a gold band under its face
const stoneRect = (hw, hh, seed = 0) => (u, v) => {
  if (Math.abs(u) > hw + .5 || Math.abs(v) > hh + .5) return null;
  const x = Math.round(u + hw), y = Math.round(v + hh);
  return y <= 0 ? C.stoneTop : y >= 2 * hh ? C.ink : (x <= 0 || x >= 2 * hw) ? C.ink : y === 2 * hh - 1 ? C.gold : marble(u, v, seed);
};
const gemShape = (r, pal, t) => {
  const sheen = Math.floor(t * 40), inner = (r - 5) * .75, spin = Math.floor(t * 4);
  return (u, v) => {
    const e = edgeD(u, v, r);
    if (e < 0) return null;
    const ei = Math.floor(e), m = Math.round(Math.max(Math.abs(u), Math.abs(v)));
    if (ei < 1) return C.ink;
    if (ei < 4) return mod(Math.round(u - v) + sheen, 80) < 5 ? C.white : GILT[ei - 1];
    if (ei < 5) return C.deep;
    if (m <= inner) return m === Math.floor(inner) ? C.deep : m < 2 ? C.white : pal[mod((m >> 1) - spin, pal.length)];
    return Math.round(Math.abs(u) + Math.abs(v)) & 1 ? C.facet0 : C.facet1;
  };
};
// a cup: floor plus two walls, pivoting about its middle
const cupShape = (hw, depth) => (u, v) => {
  const au = Math.abs(u);
  if (au > hw + .5) return null;
  if (v >= 0 && v <= 5.5) return v < 1 ? C.stoneTop : v > 4.5 ? C.ink : (Math.round(u) + 2) % 8 < 2 ? C.stone0 : C.stone1;
  if (v < 0 && v >= -depth && au >= hw - 3.5) return (au >= hw - .5 || v < -depth + 1) ? C.stoneTop : C.stone2;
  return null;
};

// rose windows: wheels of stained glass in marble tracery and a gold frame, turned by the water. The small ones'
// colors step round the wheel as time goes on (cycle); the big one keeps its own.
const D1 = { x: CX, y: 400, r: 60 };
const GLASS = ['#3cc4ff', '#ff6fb4', '#ffd23f', '#1f7ae8', '#a77bff', '#7fe8ff'].map(hex);
const roseWindow = (t, r = D1.r, seed = 0, cycle = true) => {
  const wave = mod(t * 40 + seed * 17, r + 30), shift = (cycle ? Math.floor(t * .7) : 0) + seed, lit = SHOW.glass;
  const mold = Math.max(2, r * .07), ring = r * .43, foil = r * .67, fr = r * .15, hub = Math.max(3, r * .12);
  return (u, v) => {
    const d = Math.hypot(u, v);
    if (d > r + .5) return null;
    if (d > r - 1) return C.ink;
    if (d > r - 3) return C.gold;
    if (d > r - 3 - mold) return mod(Math.atan2(v, u) * 36 / Math.PI, 2) < 1 ? C.white : MARB[2]; // beaded marble molding
    if (d > r - 4.5 - mold) return C.ink;
    if (d < hub) return d > hub - 1 ? C.ink : d < hub * .45 ? C.goldLt : C.gold;                       // gold hub
    const f = mod(Math.atan2(v, u) * 6 / Math.PI, 12), k = Math.floor(f), sp = d * Math.sin(Math.min(f - k, k + 1 - f) * Math.PI / 6);
    const fa = (k + .5) * Math.PI / 6, fd = Math.hypot(u - Math.cos(fa) * foil, v - Math.sin(fa) * foil); // a round foil in each light
    if (sp < 1.2 || Math.abs(d - ring) < 1.3 || Math.abs(fd - fr) < 1.1) return C.white;                  // tracery
    if (sp < 1.9 || Math.abs(d - ring) < 2 || Math.abs(fd - fr) < 1.8) return C.ink;
    let c = GLASS[mod(k + (d > ring ? 3 : 0) + (fd < fr ? 2 : 0) + shift, GLASS.length)];
    if (Math.abs(d - wave) < 3) c = lerpC(c, C.white, .55);
    return lit > 0 ? lerpC(c, C.white, lit * (.25 + .2 * Math.sin(t * 6 + k))) : c;
  };
};

// ---------- small sprites ----------
const BEAD = ['.XXX.', 'XHXXX', 'XXXXX', 'XXXXr', '.XrX.'];
let beadIdx = 0;
function bead(x, y, t) {
  x = Math.round(x); y = Math.round(y);
  const i = beadIdx++, glint = mod(i * .29 - t * 1.4, 7) < .35;
  for (let r = 0; r < 5; r++) for (let q = 0; q < 5; q++) {
    const ch = BEAD[r][q];
    if (ch !== '.') put(x + q - 2, y + r - 2, ch === 'X' ? C.stone1 : ch === 'r' ? C.stone0 : glint ? C.gold : C.white); // pearls
  }
}
function beadPath(pts, t, spacing = 4) {
  for (let s = 0; s < pts.length - 1; s++) {
    const [x0, y0] = pts[s], [x1, y1] = pts[s + 1];
    const n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / spacing));
    for (let k = 0; k < n; k++) bead(lerp(x0, x1, k / n), lerp(y0, y1, k / n), t);
  }
}
const boss = (u, v) => { const r = Math.hypot(u, v); return r > 3.5 ? null : r > 2.6 ? C.goldDk : r < 1.2 ? C.goldLt : C.gold; }; // a gold stud on an axle
// ============================================================
// LAYERS (back → front)
//   update(t): runs every frame even when hidden (physics, collision mask)
//   draw(t):   only when visible
//   post(t):   operates on the composite so far
// ============================================================
const layers = [];
function layer(name, opts) {
  const L = { name, on: true, buf: opts.post ? null : new Uint8ClampedArray(N), ...opts };
  if (L.static) { T = L.buf; L.draw(0); }
  layers.push(L); return L;
}

// ---- the cathedral front, painted once behind everything ----------------
// Glassy sky and clouds over twin towers with spires and a gable, the rose's recess, a gallery of arches
// and the great portal, all white marble in soft cyan shade with gold string courses and window frames.
// It's only a backdrop: what the water lands on is drawn in the temple layer in front of it.
const SKY = ['#1556d8', '#1e6ae6', '#2a80f0', '#3c98f6', '#56b0fa', '#78c8fc', '#9edcfe', '#c6ecff', '#e8f8ff'].map(hex);
const FAC = { wall: hex('#f4fcfe'), joint: hex('#dcf1f7'), shade: hex('#c4e8f2'), deep: hex('#8fd2e6'), dark: hex('#4aa6c8'), glass: hex('#6fc8ea'), trim: hex('#ffe08a') };
const TOWER = 84; // the towers stand this wide at each side
// inside a pointed (equilateral) arch hw wide, springing from y = spring
const inArch = (x, y, cx, hw, spring) => y >= spring ? Math.abs(x - cx) <= hw : Math.hypot(x - cx + hw, y - spring) <= 2 * hw && Math.hypot(x - cx - hw, y - spring) <= 2 * hw;
function lancet(x, y, cx, hw, top, bot) { // a gold-framed lancet window: its color at (x, y), or null outside it
  const spring = top + hw * 1.73;
  if (y > bot || y < top || !inArch(x, y, cx, hw, spring)) return null;
  if (!inArch(x, y, cx, hw - 2, spring + 1) || y > bot - 2) return FAC.trim;
  return x === cx ? FAC.wall : y < spring + 6 ? FAC.glass : lerpC(FAC.glass, FAC.dark, Math.min(.6, (y - spring) / (bot - spring)));
}
function facade(x, y) { // the color of the front at (x, y), or null where the sky shows
  const ax = Math.min(x, W - 1 - x), dc = Math.abs(x - CX), tower = ax < TOWER, gable = 210 + dc * .83;
  if (tower && y < 170) { // a spire and its corner pinnacles
    const sp = Math.abs(ax - 42) < 34 * (y - 30) / 140, pin = y > 118 && (Math.abs(ax - 6) < 4 * (y - 118) / 52 || Math.abs(ax - 78) < 4 * (y - 118) / 52);
    if (!sp && !pin) return null;
    if (sp && Math.abs(ax - 42) < 2 && y > 80 && y < 140) return FAC.deep;
    return (x < CX) === (ax > 42) ? FAC.shade : y % 10 === 0 ? FAC.joint : FAC.wall; // shaded on the side away from the light
  }
  if (!tower && y < gable) return y > 50 && dc < 6 * (y - 50) / 160 ? (x > CX ? FAC.shade : FAC.wall) : null; // sky, but for a slim flèche
  for (const sy of [170, 300, 545, 735, 860]) if (y >= sy && y < sy + 3) return y === sy ? FAC.trim : y === sy + 1 ? FAC.wall : FAC.shade; // string courses
  if (!tower && y < 300 && y < gable + 3) return FAC.trim;                     // the gable's gilded edge
  if (!tower && y < 296 && y > gable + 22) return FAC.shade;                   // its tympanum
  let w;
  if (tower) {
    for (const [cx, hw, top, bot] of [[42, 18, 300, 440], [30, 8, 478, 540], [54, 8, 478, 540], [42, 16, 600, 730], [42, 16, 880, 1010]])
      if ((w = lancet(ax, y, cx, hw, top, bot))) return w;
    if (y > 466 && y < 540 && inArch(ax, y, 42, 22, 504)) { const r = Math.hypot(ax - 42, y - 487); return r < 6 ? (r > 4.5 ? FAC.trim : FAC.glass) : FAC.shade; } // a roundel over the twin lancets
    if (inArch(ax, y, 42, 22, 1110)) return inArch(ax, y, 42, 18, 1114) ? lerpC(FAC.dark, FAC.deep, (y - 1080) / 160) : FAC.trim; // side portals
  } else {
    const d = Math.hypot(x - D1.x, y - D1.y);
    if (d < 72) return d > 69 ? FAC.trim : FAC.deep;                            // the rose's recess
    if (y > 560 && y < 722 && ax > 92) {                                        // a gallery of arches
      const q = mod(x - 96, 24);
      if (y > 574 && inArch(q, y, 12, 7.5, 594)) return y > 700 ? FAC.shade : FAC.deep;
      if (q <= 4 || q >= 20) return y === 572 || y === 573 ? FAC.trim : FAC.wall;
    }
    if (inArch(x, y, CX, 74, 964)) {                                            // the great portal
      if (!inArch(x, y, CX, 62, 966)) return [FAC.trim, FAC.wall, FAC.shade][[70, 66].filter(h => inArch(x, y, CX, h, 964)).length];
      if (y < 1040) return mod(x + y, 9) < 1 ? FAC.wall : FAC.shade;           // carved tympanum
      return dc < 1 || (mod(x - CX, 14) === 7 && mod(y, 14) === 7) ? FAC.trim : lerpC(FAC.dark, FAC.deep, (y - 1040) / 400); // studded doors
    }
  }
  if (ax > 78 && ax < 92) return ax < 81 || ax > 89 ? FAC.shade : FAC.wall;  // buttresses
  if (ax < 3) return FAC.shade;
  return y % 12 === 0 || mod(x + (Math.floor(y / 12) & 1) * 11, 22) === 0 ? FAC.joint : FAC.wall; // coursed blocks
}
layer('cathedral', { static: true, draw() {
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let c = facade(x, y);
    if (!c) {
      const cl = fbm(x * .012 + 4, y * .03) + .15 * Math.sin(x * .02 + y * .01) - y * .0007; // big soft clouds
      c = cl > .68 ? C.white : cl > .64 ? C.cloud : cl > .61 ? C.cloudSh : SKY[clamp(Math.round(y / 300 * 8 + BAYER[(y & 3) * 4 + (x & 3)] * 1.2), 0, 8)];
    }
    put(x, y, c);
  }
} });

// ---- shimmer: sparkles twinkling over the front and slow bands of light drifting across it ----
const SPARKS = Array.from({ length: 260 }, (_, k) => { const R = rng(900 + k); return { x: R() * W | 0, y: R() * POOL | 0, f: 1.2 + R() * 2.5, ph: R() * 9, c: R() < .5 ? C.gold : R() < .5 ? WATER[3] : C.white }; });
const rays = new Float32Array(W + H);
layer('shimmer', { draw(t) {
  for (let d = 0; d < W + H; d++) rays[d] = .14 * Math.max(0, Math.sin(d * .018 - t * .45)) ** 6;
  for (let y = vy0; y < Math.min(vy1, POOL); y++) for (let x = 0; x < W; x++) { const a = rays[(x >> 1) + y]; if (a > .01) mix(x, y, C.white, a); }
  for (const s of SPARKS) {
    if (s.y < vy0 || s.y >= vy1) continue;
    const b = Math.sin(t * s.f + s.ph);
    if (b < .55) continue;
    const k = (b - .55) / .45, n = k > .75 ? 3 : k > .35 ? 2 : 1;
    mix(s.x, s.y, s.c, k);
    for (let r = 1; r <= n; r++) for (const [dx, dy] of [[r, 0], [-r, 0], [0, r], [0, -r]]) mix(s.x + dx, s.y + dy, s.c, k * (1 - r / (n + 1)));
  }
} });

// ---- window light: stained glass in the towers' lancets, a different kind on each tier (only the top pair
// twinkles), a halo round each, candlelight flickering in the gallery's arches and through the seam of the
// portal's doors ----

    const a = Math.min(1, slife[j] * 2.5) * .9;
    mix(sx[j], sy[j], (j & 31) === 0 ? C.goldLt : WATER[4], a); // the odd drop catches the light gold
    if (sbig[j]) { mix(sx[j] + 1, sy[j], WATER[3], a * .6); mix(sx[j], sy[j] - 1, WATER[3], a * .6); }
  }
  for (const r of ripples) {
    const k = r.age / 1.2, rad = r.w + k * 16, a = (1 - k) * .5;
    for (let ang = 0; ang < Math.PI * 2; ang += .09) mix(r.x + Math.cos(ang) * rad, POOL + 2 + Math.sin(ang) * rad * .25, C.white, a);
  }
} });

// ============================================================
// COMPOSITOR + FIXED-STEP SIMULATION
// ============================================================
function blend(S) {
  for (let i = vy0 * W * 4, e = vy1 * W * 4; i < e; i += 4) {
    const a = S[i + 3];
    if (a === 0) continue;
    if (a === 255) { O[i] = S[i]; O[i + 1] = S[i + 1]; O[i + 2] = S[i + 2]; continue; }
    const k = a / 255;
    O[i] += (S[i] - O[i]) * k; O[i + 1] += (S[i + 1] - O[i + 1]) * k; O[i + 2] += (S[i + 2] - O[i + 2]) * k;
  }
}
const temple = layers.find(L => L.name === 'temple');
let simT = 0, camY = 0;
function advance(t) {
  // world moves in fixed 1/60s steps so the water behaves the same at any frame rate
  const n = Math.min(3, Math.floor((t - simT) / DT));
  for (let k = 0; k < n; k++) { simT += DT; drawOn = k === n - 1; moveHand(); temple.update(simT); simStep(); }
  drawOn = true;
  if (simT + DT <= t) simT = t; // fell behind (tab was hidden): skip ahead
}
function frame(t) {
  advance(t);
  // the camera: where the show has it, or held at ?cam= (0 is the top), or the whole front with ?view=full
  camY = FULL ? 0 : params.has('cam') ? clamp(+params.get('cam'), 0, H - VIEW) : Math.round((1 - SHOW.cam) * (H - VIEW));
  vy0 = camY; vy1 = FULL ? H : camY + VIEW;
  for (let i = vy0 * W * 4, e = vy1 * W * 4; i < e; i += 4) { O[i] = 223; O[i + 1] = 244; O[i + 2] = 255; O[i + 3] = 255; }
  for (const L of layers) {
    if (!L.on) continue;
    if (L.post) { L.post(t); continue; }
    if (!L.static && !L.update) { T = L.buf; T.fill(0); L.draw(t); }
    blend(L.buf);
  }
  ctx.putImageData(img, 0, -camY, 0, camY, W, vy1 - vy0);
}

// ============================================================
// SOUND — the sōzu's hollow knock, the pipe's tok against its stop, and the suikinkutsu:
// drips falling into a buried jar ring like small bells. Everything is synthesized, so the
// same voices can be rendered offline into a soundtrack for a recording.
// ============================================================
const SOUND = { on: false, ctx: null, out: null, log: null };
const IN_SCALE = [0, 1, 5, 7, 8].map(k => 2 ** (k / 12)); // miyako-bushi / in scale
function sfx(type, vel = 1, x = CX, note) {
  const e = { t: simT, type, vel, x, note: note ?? Math.floor(Math.random() * 10) };
  if (SOUND.log) SOUND.log.push(e);
  else if (SOUND.on && SOUND.ctx) voice(SOUND.ctx, SOUND.out, SOUND.ctx.currentTime + .02, e);
}
function soundGraph(ctx) {
  const master = ctx.createGain(); master.gain.value = 1.6; master.connect(ctx.destination);
  const verb = ctx.createConvolver(), ir = ctx.createBuffer(2, ctx.sampleRate * 2.8, ctx.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / ctx.sampleRate * 2.2); }
  verb.buffer = ir;
  const wet = ctx.createGain(); wet.gain.value = .35; verb.connect(wet).connect(master);
  const dry = ctx.createGain(); dry.connect(master); dry.connect(verb);
  // the bed: the falls themselves, as soft filtered noise
  const nb = ctx.createBuffer(2, ctx.sampleRate * 4, ctx.sampleRate);
  for (let c = 0; c < 2; c++) { const d = nb.getChannelData(c); let b = 0; for (let i = 0; i < d.length; i++) { b = b * .97 + (Math.random() * 2 - 1) * .03; d[i] = b * 4 + (Math.random() * 2 - 1) * .15; } }
  const src = ctx.createBufferSource(); src.buffer = nb; src.loop = true;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
  const g = ctx.createGain(); g.gain.value = .07;
  src.connect(lp).connect(g).connect(master); src.start();
  return dry;
}
function voice(ctx, out, when, e) {
  const pan = ctx.createStereoPanner(); pan.pan.value = clamp((e.x - CX) / CX, -1, 1) * .7; pan.connect(out);
  const tone = (f, a, dec, f1 = f) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(f, when); o.frequency.exponentialRampToValueAtTime(f1, when + dec);
    g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(a, when + .003); g.gain.exponentialRampToValueAtTime(1e-4, when + dec);
    o.connect(g).connect(pan); o.start(when); o.stop(when + dec + .05);
  };
  const click = (f, a, dec) => {
    const b = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * dec), ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 3;
    const s = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = b; bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = 2; g.gain.value = a;
    s.connect(bp).connect(g).connect(pan); s.start(when);
  };
  const v = e.vel;
  if (e.type === 'knock') {        // kon: hollow bamboo on stone
    tone(540, .5 * v, .22, 470); tone(1290, .22 * v, .09); tone(2210, .08 * v, .05); click(2600, .5 * v, .025);
  } else if (e.type === 'tok') {   // the pipe's end landing on its stop
    tone(330, .4 * v, .16, 300); tone(860, .14 * v, .07); click(1800, .3 * v, .02);
  } else if (e.type === 'bell') {  // a drip in the buried jar
    const f = 880 * IN_SCALE[e.note % 5] * (e.note >= 5 ? 2 : 1);
    tone(f, .16 * v, 2.4); tone(f * 2.76, .05 * v, .9); tone(f * 5.4, .025 * v, .35);
  }
}
// for recordings: render the logged events into a WAV (returned as base64)
async function renderSoundtrack(events, t0, dur) {
  const sr = 44100, ctx = new OfflineAudioContext(2, Math.ceil(dur * sr), sr), out = soundGraph(ctx);
  for (const e of events) if (e.t >= t0 && e.t < t0 + dur) voice(ctx, out, e.t - t0, e);
  const buf = await ctx.startRendering(), L = buf.getChannelData(0), R = buf.getChannelData(1), n = L.length;
  const wav = new DataView(new ArrayBuffer(44 + n * 4)), str = (o, s) => [...s].forEach((c, i) => wav.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); wav.setUint32(4, 36 + n * 4, true); str(8, 'WAVEfmt '); wav.setUint32(16, 16, true); wav.setUint16(20, 1, true); wav.setUint16(22, 2, true);
  wav.setUint32(24, sr, true); wav.setUint32(28, sr * 4, true); wav.setUint16(32, 4, true); wav.setUint16(34, 16, true); str(36, 'data'); wav.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) { wav.setInt16(44 + i * 4, clamp(L[i], -1, 1) * 32767, true); wav.setInt16(46 + i * 4, clamp(R[i], -1, 1) * 32767, true); }
  const bytes = new Uint8Array(wav.buffer); let bin = '';
  for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return btoa(bin);
}

// ============================================================
// THE SHOW — a 28s loop for the reel: it opens on the fountain, keeps bringing something new in as the
// camera climbs the front to the crown, then the crown shuts off and the camera sinks back down as slowly as it
// rose, the machines below still running until it reaches them.
//    always: shafts of light breathing over the front, glitter falling, star flares off the gold
//    1s gold light sweeps the marble
//    1.5s the lower cherubs tip their urns     2.5s the angel's halo flares and her beam brightens
//    3.2s jets rise out of the basin
//    5.2s the gargoyles on the ledges by the fountain fire at 5.2 / 6 into the bowl, sweeping and ducking     5.5s the inner jets     4.5–14s the camera climbs to the top
//    6–7.5s the censer swings wider across the curtain     7.5s the demons' eyes light up
//    10.5s the herald angels either side of the rose trumpet at it (the left at 10.5, the right at 11.3)
//    11s the angels sweep, rocking the rose      12.5s the rose's glass lights up
//    12.6s the gargoyles on the towers' tops start barking water in sprays up over the gable
//    14.4s a glory of light opens behind the crown     14.8s finale: gold sweep, bursts of spray at 15.2 / 15.8 / 16.4
//    16.4–17.6 the crown shuts off (the heralds, the glass, the glory, the barking gargoyles)
//    16.8–26.3 the camera sinks back down     24–26.6 everything below winds down as it gets there
// ============================================================
const LOOP = 28, T0 = 8; // T0: the world pre-runs this long before the show starts
const ramp = (u, a0, a1, b0, b1) => clamp(Math.min((u - a0) / (a1 - a0), (b1 - u) / (b1 - b0)), 0, 1); // 0 → 1 over a0..a1, 1 → 0 over b0..b1
const ease = k => k * k * (3 - 2 * k);
const SHOW = { u: 0, glint: -1, halo: 0, evil: 0, glass: 0, glory: 0, cam: 0 };
function direct(t) {
  const u = SHOW.u = mod(t - T0, LOOP);
  SHOW.cam = u < 4.5 ? 0 : u < 14 ? ease((u - 4.5) / 9.5) : u < 16.8 ? 1 : u < 26.3 ? 1 - ease((u - 16.8) / 9.5) : 0; // up and down alike
  SHOW.glint = u > 1 && u < 2 ? (u - 1) * 1400 - 40 : u > 14.8 && u < 15.8 ? (u - 14.8) * 1400 - 40 : -1;
  SHOW.halo = ramp(u, 2.5, 3, 5, 6);
  SHOW.evil = ramp(u, 7.5, 8.2, 24.4, 25.4) * (.75 + .25 * Math.sin(u * 5));
  SHOW.glass = ramp(u, 12.5, 13.2, 16.4, 17.4);
  SHOW.glory = ramp(u, 14.4, 15.2, 16.6, 17.6);
  for (const c of CHERUBS) {
    c.pour = ramp(u, 1.5, 2.2, 25.2, 26);
    c.tilt = .3 + 1.6 * c.pour + .12 * c.pour * Math.sin(u * 2.2 + c.x);
  }
  SPOUTS.forEach((p, k) => p.power = ramp(u, k < 2 ? 3.2 : 5.5, k < 2 ? 3.8 : 6.1, 25.2, 26));
  for (const g of GUNS) {
    const late = g.s > 0 ? .8 : 0, at = g.at, off = g.kind === 'angel' ? 0 : 8.6; // the heralds stop with the crown, the gargoyles on the ledges once the camera's back down
    g.power = ramp(u, at + late + 1, at + late + 1.6, 16.4 + off, 17 + off);
    const sweep = ramp(u, at + 1.5, at + 2.5, 15.5 + off, 16.5 + off) * g.sweep;
    g.a = g.aim + sweep * Math.sin((u - at) * 2.1 + (g.s > 0 ? Math.PI : 0)); // each pair sweeps against itself, so what they hit rocks
    if (g.kind === 'gargoyle') { // every few seconds a gargoyle ducks its head and dumps its water straight down
      const d = mod(u + (g.s > 0 ? 1.4 : 0) + g.y * .01, 4.2), dip = d > 2.8 ? Math.sin((d - 2.8) / 1.4 * Math.PI) : 0;
      g.a = lerp(g.a, g.duck, dip * ramp(u, at + 2, at + 2.5, 15.8 + off, 16.4 + off));
    }
  }
  CENSER.pump = .06 + .06 * ramp(u, 6, 7.5, 24, 25.2);
  for (const g of CROWN) { // they bark: a short hard burst about every 1.2s, the right one half a beat behind. A bark is
    // on or off at one speed, so its water flies one arc and carries on along it once the bark stops
    const late = g.s > 0 ? .4 : 0, beat = mod(u / 1.2 + (g.s > 0 ? .5 : 0), 1);
    g.power = u > 12.6 + late && u < 16.6 && beat < .35 ? 1 : 0;
  }
  // the swords duel: every 3.5s the angel raises its sword at the devil and shoots for a second and a half,
  // and the devil answers half a beat later (see traceAll); in between they're held point up, catching water
  SWORDS.forEach((S, k) => {
    const beat = mod(u / 3.5 + k * .5, 1);
    S.pour = beat < .45;
    S.th += ((S.pour ? SWORD_AIM : .3 + .04 * Math.sin(u * 1.1 + S.d.s)) - S.th) * (1 - Math.exp(-DT * (S.pour ? 8 : 2)));
    S.shoot = S.pour && beat > .08; // once it's up
    if (S.shoot) S.V.vol = Math.max(0, S.V.vol - DT * SWORD_RATE);
  });
  placeSwords();
  for (const c of CATCHERS) { // a shell splutters once it's full enough, in short spurts, until it's empty
    c.wait += DT;
    if (!c.spit && (c.vol > 45 || (c.vol > 15 && c.wait > 5))) c.spit = true;
    else if (c.spit && c.vol < 1) { c.spit = false; c.wait = 0; }
    c.on = c.spit && mod(u * 4 + (c.s > 0 ? .5 : 0), 1) < .55;
    if (c.on) c.vol = Math.max(0, c.vol - DT * 140);
  }
  for (const B of BROOD) { // a demon spits once it's drunk enough off its wings, until it's spat it all out
    B.wait += DT;
    if (!B.spit && (B.vol > 40 || (B.vol > 12 && B.wait > 6))) B.spit = true;
    else if (B.spit && B.vol < 1) { B.spit = false; B.wait = 0; }
    if (B.spit) B.vol = Math.max(0, B.vol - DT * 45);
  }
}

const params = new URLSearchParams(location.search);
if (params.has('only')) { const want = params.get('only').split(','); layers.forEach(L => L.on = want.includes(L.name)); }

// pre-run the world a few seconds so the water is already flowing on load; ?at=15 starts 15s into the show
let clock = +(params.get('t') || T0 + +(params.get('at') || 0));
simT = Math.max(0, clock - T0);
drawOn = false;
while (simT + DT <= clock) { simT += DT; temple.update(simT); simStep(); }
drawOn = true; temple.update(simT);

let paused = false, last = performance.now();
function loop(now) {
  if (!paused) clock += Math.min(.1, (now - last) / 1000);
  last = now;
  if (!paused) frame(clock);
  requestAnimationFrame(loop);
}
const toggle = () => { paused = !paused; };
const toCanvas = e => { const r = canvas.getBoundingClientRect(); return [clamp(Math.round((e.clientX - r.left) / r.width * W), 0, W - 1), clamp(Math.round((e.clientY - r.top) / r.height * canvas.height) + camY, 0, H - 1)]; };
canvas.addEventListener('pointermove', e => {
  if (!e.isPrimary) return;
  [HAND.tx, HAND.ty] = toCanvas(e);
  if (!HAND.on) { HAND.on = true; HAND.x = HAND.tx; HAND.y = HAND.ty; HAND.vx = HAND.vy = 0; }
});
canvas.addEventListener('pointerleave', () => { if (!HAND.down) HAND.on = false; });
canvas.addEventListener('pointerdown', e => { if (!e.isPrimary) return; canvas.setPointerCapture(e.pointerId); [HAND.tx, HAND.ty] = toCanvas(e); press(); });
// a finger has no hover, so the hand goes away when it lifts
const lift = e => { if (!e.isPrimary) return; release(); if (e.pointerType !== 'mouse') HAND.on = false; };
canvas.addEventListener('pointerup', lift);
canvas.addEventListener('pointercancel', lift);
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
});
requestAnimationFrame(loop);
</script>
