<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1c">
<title>Cascade Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f1c; --panel: #0f1528; --raise: #161e3a; --line: #24305c; --text: #dfe6ff; --dim: #8390c0;
    --accent: #3dfcff; --pink: #ff4fd8; --violet: #a46bff; --mint: #4dffb0;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 12px/1.4 var(--mono); }
  body { display: flex; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  .stage { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  canvas {
    height: min(96vh, calc((100vw - 340px) * 16 / 9));
    height: min(96dvh, calc((100vw - 340px) * 16 / 9));
    aspect-ratio: 9 / 16;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    box-shadow: 0 0 60px rgba(90, 120, 255, .25);
    cursor: none;
    touch-action: none;
  }
  canvas.editing { cursor: default; }

  /* ---- the panel ---- */
  .panel { width: 320px; flex: none; height: 100%; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; }
  .panel section { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  h1, h2 { font-family: Silkscreen, var(--mono); font-weight: 400; margin: 0; letter-spacing: .04em; }
  h1 { font-size: 16px; color: var(--accent); text-shadow: 0 0 10px rgba(61, 252, 255, .45); }
  h2 { font-size: 11px; color: var(--dim); text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: baseline; gap: 8px; }
  h2 small { font-family: var(--mono); font-size: 10px; text-transform: none; color: var(--dim); opacity: .7; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; position: sticky; top: 0; z-index: 1; background: var(--panel); }
  .tools { display: flex; gap: 4px; }
  button {
    font: inherit; color: var(--text); background: var(--raise); border: 1px solid var(--line); border-radius: 0;
    padding: 5px 8px; cursor: pointer; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .35);
  }
  button:hover { border-color: var(--accent); }
  button:active { transform: translateY(1px); box-shadow: none; }
  button:disabled { opacity: .35; cursor: default; border-color: var(--line); }
  button.on { background: var(--accent); color: #07070d; border-color: var(--accent); }
  button.danger:hover { border-color: var(--pink); color: var(--pink); }
  .seg { display: flex; }
  .seg button + button { border-left: none; }
  .icon { width: 28px; padding: 5px 0; text-align: center; }

  .adds { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .adds button { text-align: left; display: flex; align-items: center; gap: 7px; }
  .adds button.on { background: var(--raise); color: var(--accent); }
  .swatch { width: 8px; height: 8px; flex: none; box-shadow: 0 0 6px currentColor; }
  .hint { color: var(--dim); margin: 8px 0 0; min-height: 1.4em; }
  .hint b { color: var(--accent); font-weight: 400; }

  .fields { display: grid; gap: 6px; margin-top: 10px; }
  .f { display: grid; grid-template-columns: 92px 1fr 44px; align-items: center; gap: 8px; }
  .f > span { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .f output { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
  .f .seg { grid-column: 2 / 4; }
  .f .seg button { flex: 1; padding: 3px 4px; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
  .row { display: flex; gap: 4px; margin-top: 12px; }
  .row button { flex: 1; }
  .empty { color: var(--dim); margin: 0; }

  .list-sec { flex: 1; }
  #list { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
  #list button { width: 100%; display: flex; align-items: center; gap: 8px; border: 1px solid transparent; background: none; box-shadow: none; padding: 4px 6px; text-align: left; }
  #list button:hover { background: var(--raise); border-color: var(--line); }
  #list button.sel { background: var(--raise); border-color: var(--accent); }
  #list .name { flex: 1; }
  #list .xy { color: var(--dim); font-variant-numeric: tabular-nums; }

  .foot { display: flex; flex-wrap: wrap; gap: 4px; padding: 12px 14px; }
  .foot button { flex: 1; }
  kbd { font: inherit; color: var(--text); border: 1px solid var(--line); padding: 0 3px; }
  .keys { color: var(--dim); padding: 0 14px 14px; margin: 0; line-height: 1.8; }

  /* phones and narrow windows: the scene on top, the panel underneath */
  @media (max-width: 760px) {
    body { flex-direction: column; overflow: auto; height: auto; }
    .stage { flex: none; padding: 8px 0; }
    canvas { height: min(78vh, calc(100vw * 16 / 9)); height: min(78dvh, calc(100vw * 16 / 9)); box-shadow: none; }
    .panel { width: 100%; height: auto; overflow: visible; border-left: none; border-top: 1px solid var(--line); }
    .keys { display: none; }
  }
</style>
</head>
<body>
<main class="stage"><canvas id="c" class="editing" title="click a part to select it · drag to move it"></canvas></main>
<aside class="panel">
  <section class="top">
    <h1>Cascade</h1>
    <div class="tools">
      <div class="seg" id="mode"><button data-mode="edit" class="on" title="Select and move parts (E)">Edit</button><button data-mode="hand" title="Turn the machines by hand (E)">Hand</button></div>
      <button class="icon" id="pause" title="Pause (space)">❚❚</button>
      <button class="icon" id="undo" title="Undo (⌘Z)">↶</button>
      <button class="icon" id="redo" title="Redo (⇧⌘Z)">↷</button>
    </div>
  </section>
  <section>
    <h2>Add</h2>
    <div class="adds" id="adds"></div>
    <p class="hint" id="hint"></p>
  </section>
  <section id="inspector"></section>
  <section class="list-sec">
    <h2>Parts <small id="count"></small></h2>
    <ul id="list"></ul>
  </section>
  <div class="foot">
    <button id="export" title="Download your creation as a .json file">Save .json</button>
    <button id="import" title="Open a creation saved as .json">Open .json</button>
    <button id="reset" class="danger" title="Back to the original temple (undoable)">Reset</button>
    <button id="clear" class="danger" title="Remove every part (undoable)">Clear</button>
    <input type="file" id="file" accept="application/json,.json" hidden>
  </div>
  <p class="keys"><kbd>drag</kbd> move · <kbd>←↑→↓</kbd> nudge · <kbd>⌫</kbd> delete · <kbd>⌘D</kbd> duplicate · <kbd>M</kbd> mirror · <kbd>Esc</kbd> deselect · <kbd>space</kbd> pause</p>
</aside>
<script>
const W = 360, H = 640, CX = 180, N = W * H * 4;
const DY = 190;        // everything from the hills down sits this far below the original 4:5 layout
const POOL = 404 + DY; // water surface of the lake
const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d');
const img = ctx.createImageData(W, H);
const O = img.data; // composited output
let T = null;       // layer buffer currently being drawn into
let drawOn = true;  // false on simulation steps that won't be shown: shapes only write the collision mask

// ---------- utils ----------
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const lerp = (a, b, k) => a + (b - a) * k;
const lerpC = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const mod = (a, n) => ((a % n) + n) % n;
const MX = x => 2 * CX - x; // mirror across the center column

function h2(x, y) {
  let n = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = h2(xi, yi), b = h2(xi + 1, yi), c = h2(xi, yi + 1), d = h2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, y) => vnoise(x, y) * .5 + vnoise(x * 2.1, y * 2.1) * .3 + vnoise(x * 4.3, y * 4.3) * .2;
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => v / 16 - .5);

// "over" blend into the current layer buffer (straight alpha)
function mix(x, y, c, a = 1) {
  x |= 0; y |= 0;
  if (x < 0 || y < 0 || x >= W || y >= H || a <= 0) return;
  const i = (y * W + x) << 2, oa = T[i + 3] / 255;
  if (a >= 1 || oa === 0) { T[i] = c[0]; T[i + 1] = c[1]; T[i + 2] = c[2]; T[i + 3] = (a > 1 ? 1 : a) * 255; return; }
  const na = a + oa * (1 - a), k = a / na;
  T[i] += (c[0] - T[i]) * k; T[i + 1] += (c[1] - T[i + 1]) * k; T[i + 2] += (c[2] - T[i + 2]) * k; T[i + 3] = na * 255;
}
const put = (x, y, c) => mix(x, y, c, 1);
function line(x0, y0, x1, y1, c, a) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (let n = 0; n < 2000; n++) {
    mix(x0, y0, c, a);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}

// ---------- palette ----------
const C = {
  ink: hex('#07070d'), inkRim: hex('#2a2f48'), shine: hex('#c8d0e8'), gold: hex('#ffe9a8'),
  navy: hex('#13205e'), deep: hex('#0d1640'), white: hex('#f4f6ff'), mist: hex('#e2e8ff'),
  stone0: hex('#1a2560'), stone1: hex('#26368a'), stone2: hex('#3a52b8'), stoneTop: hex('#9fb4ff'),
  purpleDk: hex('#3a2a8a'), purpleEdge: hex('#a07ae8'),
  foam: hex('#f4fcff'), facet0: hex('#7d8fc0'), facet1: hex('#a8b8e0'), pupil: hex('#3fb8e0'),
  guide: hex('#1a3f9a'), jade0: hex('#35b096'), jade1: hex('#2fa48e'),
};
const WATER = ['#1f4fb8', '#2f78d8', '#4a9ae8', '#5cb4f0', '#93dcff', '#c8f0ff', '#f4fcff'].map(hex);
const RAIN = ['#c9f2e2', '#9fe3d8', '#bfe9f5', '#d2c4f5', '#b9a6ec', '#f0f4ff', '#f3c6dc', '#86c9ee', '#5fd3be', '#e8f7b0', '#a8b8f4'].map(hex);
const NEON = ['#3dfcff', '#ff4fd8', '#a46bff', '#4dffb0'].map(hex);
const TILE = ['#2fd3c0', '#1e48c8', '#8f5ae6', '#f39a3c', '#3bb6f0', '#5ee08a', '#e75fa8'].map(hex);
const CIRC = ['#1d47c9', '#f08d2e', '#9b52e0', '#e9f4ff', '#1f2e7a', '#ffd84a'].map(hex);
const SILVER = ['#5d6582', '#aeb6cc', '#e4e8f2', '#8a92ac'].map(hex);
const GEM_TOP = ['#e8fff0', '#bff7c8', '#7fe8a0', '#3fc78a', '#9af0d0'].map(hex);
const GEM_SIDE = ['#ff9ae8', '#ff5fd0', '#c040e0', '#7a3ae0', '#3a6af0'].map(hex);
const GEM_LIP = ['#ffd0e0', '#ff7fa8', '#ff4f88', '#5fd6d6', '#2a9fc0'].map(hex);

// ============================================================
// SHAPES — every piece of the temple is a shape in its own local
// coordinates, rasterized each frame with a rotation and a "phase"
// (1 = solid, 0 = gone, in between = ordered-dither dissolve).
// Solid shapes also write the collision mask the water reads.
// ============================================================
const mask = new Uint8Array(W * H);
function raster(x0, y0, ang, R, col, phase = 1, isSolid = true) {
  if (phase <= 0) return;
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const xa = Math.max(0, Math.floor(x0 - R)), xb = Math.min(W - 1, Math.ceil(x0 + R));
  const ya = Math.max(0, Math.floor(y0 - R)), yb = Math.min(H - 1, Math.ceil(y0 + R));
  for (let y = ya; y <= yb; y++) for (let x = xa; x <= xb; x++) {
    if (phase < 1 && phase <= BAYER[(y & 3) * 4 + (x & 3)] + .5) continue;
    const dx = x - x0, dy = y - y0, c = col(dx * ca + dy * sa, -dx * sa + dy * ca);
    if (!c) continue;
    if (isSolid) mask[y * W + x] = 1;
    if (drawOn) put(x, y, c);
  }
}
const toScreen = (x0, y0, ang, u, v) => [x0 + u * Math.cos(ang) - v * Math.sin(ang), y0 + u * Math.sin(ang) + v * Math.cos(ang)];
// 1 while present → dissolves out → stays gone → dissolves back in
function cycle(t, period, offset, gone = .25, fade = .12) {
  const u = mod(t / period + offset, 1), on = 1 - gone - 2 * fade;
  if (u < on) return 1;
  if (u < on + fade) return 1 - (u - on) / fade;
  if (u < on + fade + gone) return 0;
  return (u - on - fade - gone) / fade;
}
const edgeD = (u, v, r) => r + .35 - Math.abs(u) - Math.abs(v); // distance inside a diamond's edge

const stoneDiamond = r => (u, v) => {
  const e = edgeD(u, v, r);
  if (e < 0) return null;
  return e < 1 ? C.ink : e < 3 ? C.stoneTop : Math.round(Math.abs(u) + Math.abs(v)) % 6 === 0 ? C.stone2 : C.stone1;
};
const stoneRect = (hw, hh) => (u, v) => {
  if (Math.abs(u) > hw + .5 || Math.abs(v) > hh + .5) return null;
  const x = Math.round(u + hw), y = Math.round(v + hh);
  return y <= 0 ? C.stoneTop : y >= 2 * hh ? C.ink : (x <= 0 || x >= 2 * hw) ? C.ink : y === 1 ? C.stone2 : ((x + 2) % 8 < 2 ? C.stone0 : C.stone1);
};
const gemShape = (r, pal, t) => {
  const sheen = Math.floor(t * 40), inner = (r - 5) * .75, spin = Math.floor(t * 4);
  return (u, v) => {
    const e = edgeD(u, v, r);
    if (e < 0) return null;
    const ei = Math.floor(e), m = Math.round(Math.max(Math.abs(u), Math.abs(v)));
    if (ei < 1) return C.ink;
    if (ei < 4) return mod(Math.round(u - v) + sheen, 80) < 5 ? C.white : SILVER[ei - 1];
    if (ei < 5) return C.deep;
    if (m <= inner) return m === Math.floor(inner) ? C.deep : m < 2 ? C.white : pal[mod((m >> 1) - spin, pal.length)];
    return Math.round(Math.abs(u) + Math.abs(v)) & 1 ? C.facet0 : C.facet1;
  };
};
// a circuit maze for a diamond face: one quadrant of random traces and pads (values 1..ncol pick
// the color), mirrored four ways when drawn
function circuitMaze(r, cell, ncol, seed) {
  const R = rng(seed), n = Math.ceil((r + 1) / cell), m = new Uint8Array((r + 1) * (r + 1)), pad = cell >> 1;
  for (let gy = 0; gy < n; gy++) for (let gx = 0; gx < n; gx++) {
    const top = R() < .5, left = R() < .5, dot = R() < .3, col = 1 + Math.floor(R() * ncol);
    for (let ly = 0; ly < cell; ly++) for (let lx = 0; lx < cell; lx++) {
      const dx = gx * cell + lx, dy = gy * cell + ly;
      if (dx > r || dy > r) continue;
      if ((top && ly === 0) || (left && lx === 0) || (dot && lx === pad && ly === pad)) m[dy * (r + 1) + dx] = col;
    }
  }
  return m;
}
// side diamond faces: a finer circuit in the tile colors over dark violet, with the same sweep of light as the great diamond
const TILE_BG = ['#1a1f5c', '#221a66', '#2c3a9a'].map(hex);
const tileMazes = {};
const tileShape = (r, t, seed) => {
  const maze = tileMazes[r + ':' + seed] ??= circuitMaze(r, 3, TILE.length, 97 + seed * 31);
  const wave = mod(t * 18 + seed * 9, r + 20), shift = t * 1.5;
  return (u, v) => {
    const e = edgeD(u, v, r);
    if (e < 0) return null;
    if (e < 2) return C.navy;
    const ax = Math.min(r, Math.round(Math.abs(u))), ay = Math.min(r, Math.round(Math.abs(v))), d = ax + ay;
    const cv = maze[ay * (r + 1) + ax];
    let c = cv ? TILE[mod(cv - 1 + seed + Math.floor(shift - d / 6), TILE.length)] : d % 9 === 0 ? TILE_BG[2] : TILE_BG[(d >> 2) & 1];
    if (Math.abs(d - wave) < 1.5) c = lerpC(c, C.white, cv ? .7 : .3);
    return c;
  };
};
// stone sōzu tube: hollow chamber from the node (v = 0) out to the mouth (v = -depth), solid butt behind the node
const stoneTube = (R, inner, depth, butt) => (u, v) => {
  const au = Math.abs(u);
  if (au > R + .5 || v < -depth - .5 || v > butt + .5) return null;
  if (v < -.5 && au < inner) return null;
  if (au > R - .8 || v > butt - 1 || v < -depth + .5) return v < -depth + .5 ? C.stoneTop : C.ink;
  if (Math.abs(v) < 1.2) return C.stoneTop;                        // the node
  return u < -R + 2.2 ? C.stoneTop : mod(Math.round(v), 8) < 2 ? C.stone0 : C.stone1;
};
// half of a split-bamboo trough: a floor, the middle node on its inner end, and an open outer end
const bambooHalf = (hw, depth, side) => (u, v) => {
  if (Math.abs(u) > hw + .5) return null;
  if (v >= 0 && v <= 4.5) return v < 1 ? C.stoneTop : v > 3.5 ? C.ink : Math.abs(Math.round(u) - side * hw * .2) < 1 ? C.stone0 : C.stone1;
  if (v < 0 && v >= -depth && u * -side >= hw - 3) return u * -side >= hw - .5 || v < -depth + 1 ? C.stoneTop : C.stone2;
  return null;
};
const troughBack = (hw, depth) => (u, v) => Math.abs(u) <= hw && v <= -depth + 1.5 && v >= -depth ? C.stone2 : null; // the trough's far rim
// a cup: floor plus two walls, pivoting about its middle
const cupShape = (hw, depth) => (u, v) => {
  const au = Math.abs(u);
  if (au > hw + .5) return null;
  if (v >= 0 && v <= 5.5) return v < 1 ? C.stoneTop : v > 4.5 ? C.ink : (Math.round(u) + 2) % 8 < 2 ? C.stone0 : C.stone1;
  if (v < 0 && v >= -depth && au >= hw - 3.5) return (au >= hw - .5 || v < -depth + 1) ? C.stoneTop : C.stone2;
  return null;
};

// great diamond face: a circuit maze (one quadrant, mirrored four ways)
const circMazes = {};
const circuitFace = (r, t) => {
  const circ = circMazes[r] ??= circuitMaze(r, 4, CIRC.length, 42);
  const wave = mod(t * 22, r + 24), shift = t * 1.5;
  return (u, v) => {
    const e = edgeD(u, v, r);
    if (e < 0) return null;
    if (e < 1) return C.ink;
    if (e < 3) return C.stoneTop;
    if (e < 4.5) return C.deep;
    const ax = Math.min(r, Math.round(Math.abs(u))), ay = Math.min(r, Math.round(Math.abs(v))), d = ax + ay;
    const cv = circ[ay * (r + 1) + ax];
    let c = cv ? CIRC[mod(cv - 1 + Math.floor(shift - d / 8), CIRC.length)] : d % 12 === 0 ? C.guide : ((d >> 2) & 1) ? C.jade0 : C.jade1;
    if (Math.abs(d - wave) < 2) c = lerpC(c, C.white, cv ? .7 : .35);
    return c;
  };
};

// ---------- small sprites ----------
const BEAD = ['.XXX.', 'XHXXX', 'XXXXX', 'XXXXr', '.XrX.'];
let beadIdx = 0;
function bead(x, y, t) {
  x = Math.round(x); y = Math.round(y);
  const i = beadIdx++, glint = mod(i * .29 - t * 1.4, 7) < .35;
  for (let r = 0; r < 5; r++) for (let q = 0; q < 5; q++) {
    const ch = BEAD[r][q];
    if (ch !== '.') put(x + q - 2, y + r - 2, ch === 'X' ? C.ink : ch === 'r' ? C.inkRim : glint ? C.gold : C.shine);
  }
}
function beadPath(pts, t, spacing = 4) {
  for (let s = 0; s < pts.length - 1; s++) {
    const [x0, y0] = pts[s], [x1, y1] = pts[s + 1];
    const n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / spacing));
    for (let k = 0; k < n; k++) bead(lerp(x0, x1, k / n), lerp(y0, y1, k / n), t);
  }
}
const diamondRing = (x, y, r, ang) => [[0, -r], [r, 0], [0, r], [-r, 0], [0, -r]].map(([u, v]) => toScreen(x, y, ang, u, v));
const EYE = ['..xxxxx..', '.xwwbwwx.', 'xwwbpbwwx', '.xwwbwwx.', '..xxxxx..'];
function eye(cx, cy, t, seed) {
  const blink = mod(t + seed * 1.7, 5.3) < .14, look = Math.round(Math.sin(t * .7 + seed) * 1.2);
  const col = { x: C.ink, w: C.white, b: C.pupil, p: C.ink };
  for (let r = 0; r < 5; r++) for (let q = 0; q < 9; q++) {
    let ch = EYE[r][q];
    if (ch === '.') continue;
    if (blink) { if (r === 2) put(cx + q - 4, cy, C.ink); continue; }
    if ((ch === 'b' || ch === 'p') && (q + look < 2 || q + look > 6)) ch = 'w';
    put(cx + q - 4 + ((ch === 'b' || ch === 'p') ? look : 0), cy + r - 2, col[ch]);
  }
}
// ============================================================
// LAYERS (back → front)
//   update(t): runs every frame even when hidden (physics, collision mask)
//   draw(t):   only when visible
//   post(t):   operates on the composite so far
// ============================================================
const layers = [];
function layer(name, opts) {
  const L = { name, on: true, buf: opts.post ? null : new Uint8ClampedArray(N), ...opts };
  if (L.static) { T = L.buf; L.draw(0); }
  layers.push(L); return L;
}

// ---- rising rain: faint pixel curtains drifting up off the lake ----------
const PL = 256;
const rain = [];
(function buildRain() {
  const R = rng(3);
  for (let x = 0; x < W; x++) {
    const pat = new Uint8Array(PL), dens = x % 2 === 0 ? .45 : .2;
    let p = 0;
    while (p < PL) {
      if (R() < dens) { const len = 1 + Math.floor(R() * 5), ci = 1 + Math.floor(R() * RAIN.length); for (let k = 0; k < len && p < PL; k++) pat[p++] = ci; p++; }
      else p += 1 + Math.floor(R() * 3);
    }
    const top = 40 + Math.floor(fbm(x * .07, 5) * 160 + R() * 40); // where it has faded out entirely
    const a = x % 2 === 0 ? .24 : .13, fade = new Float32Array(H); // strongest just above the lake, gone by the top
    for (let y = top; y < POOL; y++) fade[y] = a * ((y - top) / (POOL - top)) ** .7 * Math.min(1, (POOL - y) / 12);
    rain.push({ pat, top, fade, sp: 6 + R() * 18, ph: R() * PL });
  }
})();
layer('rising rain', { draw(t) {
  for (let x = 0; x < W; x++) {
    const col = rain[x], off = Math.floor(t * col.sp + col.ph);
    for (let y = col.top; y < POOL; y++) {
      const ci = col.pat[(y + off) & (PL - 1)];
      if (ci) mix(x, y, RAIN[ci - 1], col.fade[y]);
    }
  }
} });

// ---- bodies on axles: nothing turns them but the water ----------
// Each has inertia, axle friction and a little ballast that pulls it back toward its rest angle;
// water landing on it (and the weight and drag of water running over it) supplies the torque.
function body(x, y, R, o) { return { x, y, R, a: 0, w: 0, I: 1, bal: 0, fric: .4, ...o }; }
// torque about (cx, cy) from the water within R of it: the weight of water running over a surface
// plus its drag along the way it's flowing, and the punch of falling water where it lands
function waterTorque(cx, cy, R) {
  let tq = 0;
  for (const s of streams) {
    for (let i = 0; i < s.nd; i++) {
      if (s.kind[i] !== 1) continue;
      const dx = s.xs[i] - cx, dy = s.ys[i] - cy;
      if (dx * dx + dy * dy > R * R) continue;
      const j = Math.min(i + 1, s.nd - 1), fx = (s.xs[j] - s.xs[i]) * .6, fy = 1 + (s.ys[j] - s.ys[i]) * .6;
      tq += s.width[i] * (dx * fy - dy * fx);
    }
    for (const i of s.impacts) {
      if (i >= s.nd) break;
      const dx = s.xs[i] - cx, dy = s.ys[i] - cy;
      if (dx * dx + dy * dy <= R * R) tq += dx * s.width[i] * fallSpeed(s.run[i]) / 25;
    }
  }
  return tq;
}
function spinBody(b, tq) {
  b.w += (tq / b.I - b.bal * Math.sin(b.a) - b.fric * b.w) * DT;
  b.a += b.w * DT;
}

// ---- vessels ----------------
// Vessels hold water by volume: it fills them from the bottom up at any tilt and
// pours over whichever lip ends up below the surface (see fillVessel).
const vessels = []; // every part's vessels, gathered by relink()
const vessel = o => ({ x: 0, y: 0, ang: 0, vol: 0, cap: 1, surf: 0, pix: [], spill: [], qin: 10, qout: 24, ...o });
const rasterVessel = V => raster(V.x, V.y, V.ang, V.reach || Math.hypot(V.hw + 1, V.depth + 6), V.shape || cupShape(V.hw, V.depth));

const wheelShape = (r, n) => (u, v) => {
  const rr = Math.hypot(u, v);
  if (rr > r + .5) return null;
  if (rr < 5.5) return rr < 2.2 ? C.gold : rr > 4.5 ? C.ink : C.stoneTop;
  const step = Math.PI * 2 / n, a = Math.atan2(v, u), da = a - Math.round(a / step) * step;
  const along = rr * Math.cos(da), perp = rr * Math.sin(da);
  if (along > r - 2.5 && perp > -1.5 && perp < 5.5) return along > r - .8 || perp > 4.6 ? C.ink : C.stoneTop; // paddle
  if (Math.abs(perp) <= 1.5) return Math.abs(perp) > .8 ? C.ink : C.stone2;                                  // spoke
  return null;
};
const hubShape = (u, v) => { const r = Math.hypot(u, v); return r > 5.5 ? null : r < 2.2 ? C.gold : r > 4.5 ? C.ink : C.stoneTop; };
const rockShape = (u, v) => { const r = u * u / 36 + v * v / 16; return r > 1 ? null : r > .7 ? C.ink : v < -1 ? C.stoneTop : C.stone1; };
function thickLine(x0, y0, x1, y1, c, th = 1) {
  for (let o = -th; o <= th; o++) line(x0, y0 + o, x1, y1 + o, o === -th ? C.stoneTop : o === th ? C.ink : c);
}
function stand(x, y, y1, hw) { // a little A-frame from an axle down to the ground behind it
  line(x, y, x - hw, y1, C.inkRim); line(x, y, x + hw, y1, C.inkRim); line(x - hw - 2, y1, x + hw + 2, y1, C.stone1);
}
const SOZU_PIV = 3, SOZU_CM = 7; // pivot sits 3px toward the mouth from the node; the empty tube's balance point 7px behind it

// ---- the hand: the cursor, a solid glove the water lands on ----------------
// Pressing on anything on an axle takes hold of it to turn it by hand; the chain's buckets run along their chain.
const GLOVE = { o: C.ink, w: C.white, s: hex('#b4bee6'), c: C.purpleEdge, d: C.purpleDk };
const POINT = [
  '....oo..........',
  '...owwo.........',
  '...owso.........',
  '...owso.........',
  '...owsooo.......',
  '...owsowsooo....',
  '...owsowsowsooo.',
  'oooowsowsowsowso',
  'owwswwwwwwwwwwso',
  'owsswwwwwwwwwwso',
  '.owwwwwwwwwwwwso',
  '..owwwwwwwwwwsso',
  '..owwwwwwwwwwso.',
  '...owwwwwwwwsso.',
  '...occcccccccco.',
  '...ocdcdcdcdcdo.',
  '...oooooooooooo.',
];
const FIST = [
  '....oo.oo.......',
  '...owsowsooo....',
  '...owsowsowsooo.',
  ...POINT.slice(7),
];
const HAND = { on: false, tx: 0, ty: 0, x: 0, y: 0, vx: 0, vy: 0, down: false, grab: null, phi: 0, turn: 0, base: 0, x0: 0, y0: 0, wet: 0 };

// everything on an axle, which the hand can turn but never move: the angle it turns (with the sign
// that makes it clockwise on screen), the axle, and hit(x, y) < 1 where the hand is touching it
const disc = (at, r) => (x, y) => { const [px, py] = at(); return Math.hypot(x - px, y - py) / r; };
const box = (at, hw, hh, ang = () => 0, off = 0) => (x, y) => {
  const [px, py] = at(), a = ang(), ca = Math.cos(a), sa = Math.sin(a), dx = x - px, dy = y - py;
  return Math.max(Math.abs(dx * ca + dy * sa) / hw, Math.abs(-dx * sa + dy * ca - off) / hh);
};
const pos = o => () => [o.x, o.y];
const axle = (o, key, at, hit, sg = 1) => ({ o, key, at, hit, sg });
// gathered from the parts by relink(). Tracks are things that run along a chain instead of turning:
// along(dx, dy) is how far the hand's pull since taking hold has run their chain (ch)
let AXLES = [], TRACKS = [];
const handAngle = A => { const [px, py] = A.at(); return Math.atan2(HAND.y - py, HAND.x - px); };
// pressing on a part takes hold of it; dragging then turns it about its axle
function press() {
  HAND.on = HAND.down = true;
  HAND.x = HAND.tx; HAND.y = HAND.ty;
  let bs = 1;
  for (const A of [...AXLES, ...TRACKS]) { const s = A.hit(HAND.x, HAND.y); if (s < bs) { bs = s; HAND.grab = A; } }
  if (HAND.grab && HAND.grab.along) { HAND.x0 = HAND.x; HAND.y0 = HAND.y; HAND.base = HAND.grab.ch.pos; }
  else if (HAND.grab) { HAND.phi = handAngle(HAND.grab); HAND.turn = 0; HAND.base = HAND.grab.o[HAND.grab.key]; }
}
function release() { HAND.down = false; HAND.grab = null; }
function moveHand() {
  HAND.vx = lerp(HAND.vx, (HAND.tx - HAND.x) / DT, .5); HAND.vy = lerp(HAND.vy, (HAND.ty - HAND.y) / DT, .5);
  HAND.x = HAND.tx; HAND.y = HAND.ty;
  const A = HAND.grab;
  if (A && A.along) { // run the chain toward wherever the hand has pulled it
    const target = clamp(HAND.base + A.along(HAND.x - HAND.x0, HAND.y - HAND.y0), 0, A.ch.travel);
    A.ch.v = clamp((target - A.ch.pos) / DT, -400, 400);
  } else if (A) { // spin it toward however far the hand has gone round the axle; let go mid-turn and it keeps spinning
    const phi = handAngle(A);
    HAND.turn += mod(phi - HAND.phi + Math.PI, Math.PI * 2) - Math.PI; HAND.phi = phi;
    A.o.w = clamp((HAND.base + A.sg * HAND.turn - A.o[A.key]) / DT, -15, 15);
  }
}
function drawHand() {
  if (!HAND.on) return;
  const rows = HAND.down ? FIST : POINT, ox = HAND.x - (HAND.down ? 8 : 4), oy = HAND.y - (HAND.down ? 8 : 0); // pressed: a fist, whether or not it caught hold of anything
  for (let r = 0; r < rows.length; r++) for (let q = 0; q < 16; q++) {
    const ch = rows[r][q], x = ox + q, y = oy + r;
    if (ch === '.' || x < 0 || y < 0 || x >= W || y >= H) continue;
    mask[y * W + x] = 1;
    if (drawOn) put(x, y, GLOVE[ch]);
  }
}
// water on the glove: a fast hand flings it off, and a wet one drips
function handFx() {
  if (!HAND.on) return;
  const cx = HAND.x + (HAND.down ? 0 : 4), cy = HAND.y + (HAND.down ? 0 : 8);
  const { vx, vy } = HAND, fast = vx * vx + vy * vy > 3600;
  let hits = 0;
  for (const s of streams) for (let i = 0; i < s.nd; i++) {
    const dx = s.xs[i] - cx, dy = s.ys[i] - cy;
    if (dx * dx > 100 || dy * dy > 121) continue;
    hits += s.width[i];
    if (fast && Math.random() < .12) drop(s.xs[i], s.ys[i], vx * .6 + (Math.random() - .5) * 50, vy * .6 - 30 - Math.random() * 70, .35 + Math.random() * .4, Math.random() < .3);
  }
  HAND.wet = Math.min(1, HAND.wet * .993 + hits * .003);
  if (Math.random() < HAND.wet * .5) drop(cx + (Math.random() - .5) * 12, cy + 7 + Math.random() * 3, vx * .3 + (Math.random() - .5) * 6, Math.max(0, vy * .3) + 8, .4 + Math.random() * .4);
}

// ============================================================
// SCENE — the temple is a list of parts, each a type and its params ({ type, x, y, ... }).
// A type's create(p) builds a live part that reads its position from p every step (so a part
// can be dragged without resetting it); changing any other param rebuilds it. A live part may have:
//   base(t)    the temple's stone, always rastered (it's what the water runs over)
//   place()    position its vessels for this step
//   back(t)    fittings behind the machines, drawn only on shown frames
//   front(t)   the machines' solid parts
//   step()     physics, after the water is traced
//   sources()  [x, y, width, dir, pulse?] for each stream it pours
//   vessels, axles, tracks, pivots
// A type's bounds(p) is [hw, hh, dy, dx]: the box around (x + dx, y + dy) the editor picks it by.
// ============================================================
const GEMS = { top: GEM_TOP, side: GEM_SIDE, lip: GEM_LIP };
const TYPES = {};
const num = (key, label, min, max, step = 1) => ({ key, label, min, max, step });
const opt = (key, label, options) => ({ key, label, options }); // options: [[value, text], ...]
const kind = (type, def) => { TYPES[type] = { type, fields: [], mirror: p => ({ ...p, x: MX(p.x) }), ...def }; };

kind('spring', {
  label: 'Spring', color: GEM_TOP[2], hint: 'A gem that pours from both lower faces, surging unevenly.',
  defaults: { r: 11, gem: 'side', flow: 3, amp: 2.5, freq: .5, phase: 0 },
  fields: [num('r', 'size', 6, 30), opt('gem', 'gem', [['top', 'jade'], ['side', 'violet'], ['lip', 'rose']]),
    num('flow', 'flow', 1, 8, .5), num('amp', 'surge', 0, 6, .5), num('freq', 'surge speed', .1, 1.5, .01)],
  bounds: p => [p.r + 1, p.r + 1],

      sources: () => [[p.x - ex, p.y + ey, 1, -1, pulse[0]], [p.x + ex, p.y + ey, 1, 1, pulse[1]]],
      base(t) { raster(p.x, p.y, 0, p.r, gemShape(p.r, GEMS[p.gem], t)); },
    };

kind('ledge', {

kind('wheel', {

// weighted below so it settles level; water landing on one side tips it and runs off the low end
kind('flipper', {
  label: 'Flipper', color: NEON[1], hint: 'A stone paddle balanced on a pivot, weighted below so it settles level.',
  defaults: { hw: 14 },
  fields: [num('hw', 'half width', 5, 30)],
  bounds: p => [p.hw + 2, 10, 6],
  create(p) {
    const f = { a: 0, w: 0 }, at = pos(p);
    return {
      back(t) { line(p.x, p.y, p.x, p.y + 12, C.inkRim); bead(p.x, p.y + 14, t); }, // the bob that keeps it level
      front() { raster(p.x, p.y, f.a, p.hw + 2, stoneRect(p.hw, 2)); },
      step() { // weight of water running on the paddle about its pivot, against the bob hanging below
        const ca = Math.cos(f.a), sa = Math.sin(f.a);
        let tq = 0;
        for (const s of streams) for (let i = 0; i < s.nd; i++) {
          if (s.kind[i] !== 1) continue;
          const dx = s.xs[i] - p.x, dy = s.ys[i] - p.y, u = dx * ca + dy * sa, v = -dx * sa + dy * ca;
          if (Math.abs(u) <= p.hw + 1 && v >= -6 && v <= 1) tq += dx * s.width[i];

        for (const s of streams) for (const i of s.impacts) {
          if (i >= s.nd) break;

          if (Math.abs(dx) <= p.hw + 1 && Math.abs(dy) <= 6) tq += dx * s.width[i] * fallSpeed(s.run[i]) / 40;
        }
        f.w += (tq / 150 - 3 * Math.sin(f.a) - 1.6 * f.w) * DT; f.a += f.w * DT;
        if (Math.abs(f.a) > .7) { f.a = Math.sign(f.a) * .7; f.w *= -.3; }

      axles: [axle(f, 'a', at, box(at, p.hw + 1, 5, () => f.a))], pivots: [p],

// sōzu (shishi-odoshi): a bamboo tube pivoted off its balance point with its mouth up under a fall.

kind('sozu', {
  label: 'Sōzu', color: GEM_TOP[3], hint: 'A bamboo tube that fills, tips and pours, then knocks back against its rock.',
  defaults: { s: -1 },

    if (inst.axles) AXLES.push(...inst.axles);

function loadScene(list) {

// ---- water: traced streams that re-route every frame as the temple moves ----------
// Every step, each spring's water is traced pixel-by-pixel through the collision mask:
//   fall straight down → if blocked, slip diagonally → else run along the surface → spill off the end.
// A stream that runs into another one merges and widens it downstream.
// Water only exists where it has had time to flow: a stream is drawn as far as last step's water
// (within a couple of pixels) plus one step of travel, so a new route grows at flow speed. Water
// that gets cut off from its spring keeps going as a "ghost" that drains away at the same speed.
// Particles (spray, shed droplets, ripples) ride on top.
const DT = 1 / 60, G_ACC = 420;
const owner = new Int32Array(W * H), ownerI = new Int32Array(W * H);
const wmask = new Uint8Array(W * H); // water standing in the basin is a surface too
const blockedW = (x, y) => x < 0 || x >= W || y >= H || (y >= 0 && (mask[y * W + x] === 1 || wmask[y * W + x] === 1));

  const R = rng(seed * 13 + 7), pat = new Uint8Array(64);
  for (let p = 0; p < 64;) {               // streak pattern: runs of shades with foam flecks
    const len = 2 + Math.floor(R() * 6), c = R() < .12 ? 6 : R() < .35 ? 5 : 1 + Math.floor(R() * 4);
    for (let k = 0; k < len && p < 64; k++) pat[p++] = c;

let streams = [];
const splits = []; // streams parted off where water lands on a flat or a peak, traced after their parents
// a bump water can brim over: one pixel high, and the surface drops back down within a couple of pixels
const bump = (x, y, d) => !blockedW(x + d, y - 1) && !blockedW(x, y - 1) && (!blockedW(x + 2 * d, y) || !blockedW(x + 3 * d, y));
// the vessel (if any) whose cavity holds (x, y)
function vesselAt(x, y) {
  for (const V of vessels) {
    const ca = Math.cos(V.ang), sa = Math.sin(V.ang), dx = x - V.x, dy = y - V.y;
    const u = dx * ca + dy * sa, v = -dx * sa + dy * ca;
    if (Math.abs(u) < V.hw && v > -V.depth - 4 && v < 2) return V;
  }
  return null;
}
// water trapped in a hollow that isn't a vessel rises until it can step over one side of the rim
function overflow(x, y, dir) {
  if (vesselAt(x, y)) return null;                       // in a vessel it's just filling it
  for (let h = 1; h <= 10 && !blockedW(x, y - h); h++)
    for (const d of [dir, -dir]) if (!blockedW(x + d, y - h)) return [x + d, y - h, d];

function trace(x, y, w, dir, seed, from = null) {

  streams.push(s);

  for (let step = 0; step < 1500; step++) {

        const e = overflow(x, y, dir);                   // ...so it fills up and spills over the rim
        if (!e) break;
        [x, y, dir] = e; revisits = 0; tau += 1.3; continue;
      }
      if (o >= 0 && o !== id) {                          // join the other stream: it widens from here on
        s.merge = [o, ownerI[k]]; s.end = 'merge'; break;

    }
    s.xs.push(x); s.ys.push(y); s.tau.push(tau); s.width.push(w); s.run.push(run);
    s.kind.push(falling ? 0 : 1); s.dir.push(moved ? dir : 0);

  const pan = ctx.createStereoPanner(); pan.pan.value = clamp((e.x - CX) / CX, -1, 1) * .7; pan.connect(out);
  const tone = (f, a, dec, f1 = f) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(f, when); o.frequency.exponentialRampToValueAtTime(f1, when + dec);
    g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(a, when + .003); g.gain.exponentialRampToValueAtTime(1e-4, when + dec);
    o.connect(g).connect(pan); o.start(when); o.stop(when + dec + .05);
  };
  const click = (f, a, dec) => {
    const b = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * dec), ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 3;
    const s = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = b; bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = 2; g.gain.value = a;
    s.connect(bp).connect(g).connect(pan); s.start(when);
  };
  const v = e.vel;
  if (e.type === 'knock') {        // kon: hollow bamboo on stone
    tone(540, .5 * v, .22, 470); tone(1290, .22 * v, .09); tone(2210, .08 * v, .05); click(2600, .5 * v, .025);
  } else if (e.type === 'tok') {   // the pipe's end landing on its stop
    tone(330, .4 * v, .16, 300); tone(860, .14 * v, .07); click(1800, .3 * v, .02);
  } else if (e.type === 'bell') {  // a drip in the buried jar
    const f = 880 * IN_SCALE[e.note % 5] * (e.note >= 5 ? 2 : 1);
    tone(f, .16 * v, 2.4); tone(f * 2.76, .05 * v, .9); tone(f * 5.4, .025 * v, .35);
  }
}
// for recordings: render the logged events into a WAV (returned as base64)
async function renderSoundtrack(events, t0, dur) {
  const sr = 44100, ctx = new OfflineAudioContext(2, Math.ceil(dur * sr), sr), out = soundGraph(ctx);
  for (const e of events) if (e.t >= t0 && e.t < t0 + dur) voice(ctx, out, e.t - t0, e);
  const buf = await ctx.startRendering(), L = buf.getChannelData(0), R = buf.getChannelData(1), n = L.length;
  const wav = new DataView(new ArrayBuffer(44 + n * 4)), str = (o, s) => [...s].forEach((c, i) => wav.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); wav.setUint32(4, 36 + n * 4, true); str(8, 'WAVEfmt '); wav.setUint32(16, 16, true); wav.setUint16(20, 1, true); wav.setUint16(22, 2, true);
  wav.setUint32(24, sr, true); wav.setUint32(28, sr * 4, true); wav.setUint16(32, 4, true); wav.setUint16(34, 16, true); str(36, 'data'); wav.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) { wav.setInt16(44 + i * 4, clamp(L[i], -1, 1) * 32767, true); wav.setInt16(46 + i * 4, clamp(R[i], -1, 1) * 32767, true); }
  const bytes = new Uint8Array(wav.buffer); let bin = '';
  for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return btoa(bin);
}

// ============================================================
// EDITOR — in edit mode, clicking a part on the canvas selects it and dragging moves it; the panel
// adds parts and edits the selected one's params. The scene is saved in this browser as it changes.
// ============================================================
const $ = id => document.getElementById(id);
const STORE = 'cascade-editor-scene';
const ED = { on: true, sel: null, shown: undefined, hover: null, drag: null, placing: null, last: null, nudged: false, msg: '' };
const selected = () => parts.find(e => e.id === ED.sel) || null;
const sceneList = () => parts.map(e => ({ type: e.type, ...e.p }));

// the box the editor picks a part by (and outlines it with)
function boxOf(e) {
  const [hw, hh, dy = 0, dx = 0] = TYPES[e.type].bounds(e.p), cx = e.p.x + dx, cy = e.p.y + dy;
  return [Math.round(cx - hw), Math.round(cy - hh), Math.round(cx + hw), Math.round(cy + hh)];
}
// the smallest part under (x, y), so a bowl sitting in front of a big diamond can still be picked
function pickAt(x, y) {
  let best = null, ba = Infinity;
  for (const e of parts) {
    const [x0, y0, x1, y1] = boxOf(e), T = TYPES[e.type];
    if (T.pick ? !T.pick(e.inst, x, y) : x < x0 || x > x1 || y < y0 || y > y1) continue;
    const a = (x1 - x0) * (y1 - y0);
    if (a < ba) { ba = a; best = e; }
  }
  return best;
}
// marching-ants outline around a part, and a cross on its origin
function outline(e, c, a, t) {
  const [x0, y0, x1, y1] = boxOf(e), ph = Math.floor(t * 12);
  const dot = (x, y, d, k = a) => {
    if (x < 0 || y < 0 || x >= W || y >= H || mod(d - ph, 6) >= 3) return;
    const i = (y * W + x) << 2;
    O[i] += (c[0] - O[i]) * k; O[i + 1] += (c[1] - O[i + 1]) * k; O[i + 2] += (c[2] - O[i + 2]) * k;
  };
  for (let x = x0; x <= x1; x++) { dot(x, y0, x); dot(x, y1, -x); }
  for (let y = y0; y <= y1; y++) { dot(x1, y, y); dot(x0, y, -y); }
  if (a === 1) for (let k = -2; k <= 2; k++) { dot(e.p.x + k, e.p.y, ph, .8); dot(e.p.x, e.p.y + k, ph, .8); }
}
layer('editor', { post(t) {
  if (!ED.on) return;
  const sel = selected(), hov = parts.find(e => e.id === ED.hover);
  if (hov && hov !== sel) outline(hov, NEON[2], .6, t);
  if (sel) outline(sel, NEON[0], 1, t);
} });

// ---- history: snapshots of the scene, for undo; each one is also saved to this browser ----
const hist = { list: [], i: -1 };
const save = s => { try { localStorage.setItem(STORE, s); } catch {} };
function record() {
  const s = JSON.stringify(sceneList());
  if (hist.list[hist.i] !== s) {
    hist.list.length = hist.i + 1; hist.list.push(s); hist.i++;
    if (hist.list.length > 200) { hist.list.shift(); hist.i--; }
    save(s);
  }
  refresh();
}
function restore(s) {
  const at = parts.findIndex(e => e.id === ED.sel), was = parts[at];
  loadScene(JSON.parse(s));
  if (was && !selected()) ED.sel = parts[at] && parts[at].type === was.type ? parts[at].id : null; // its params changed, so it was rebuilt
  save(s); refresh();
}
const undo = () => { cancelPlacing(); if (hist.i > 0) restore(hist.list[--hist.i]); };
const redo = () => { cancelPlacing(); if (hist.i < hist.list.length - 1) restore(hist.list[++hist.i]); };

// ---- editing ----
function moveTo(e, x, y) {
  e.p.x = clamp(Math.round(x), 0, W - 1); e.p.y = clamp(Math.round(y), 0, H - 1);
  syncXY(e);
}
function setParam(e, key, v) {
  e.p[key] = v;
  if (key !== 'x' && key !== 'y') { build(e); relink(); }
}
// a new part follows the pointer until a click drops it
function addPart(type) {
  cancelPlacing();
  if (!ED.on) setMode(true);
  const [x, y] = ED.last || [CX, 300], e = makePart({ type, x, y });
  parts.push(e); relink();
  ED.placing = e; ED.sel = e.id;
  refresh();
}
function cancelPlacing() {
  if (!ED.placing) return;
  parts = parts.filter(e => e !== ED.placing); relink();
  ED.placing = null; ED.sel = null;
  refresh();
}
function removePart(e) {
  parts = parts.filter(q => q !== e); relink();
  if (ED.sel === e.id) ED.sel = null;
  record();
}
function insertAfter(e, o) {
  const n = makePart(o);
  parts.splice(parts.indexOf(e) + 1, 0, n); relink();
  ED.sel = n.id; record();
}
const duplicate = e => insertAfter(e, { type: e.type, ...e.p, x: clamp(e.p.x + 12, 0, W - 1), y: clamp(e.p.y + 12, 0, H - 1) });
const mirror = e => insertAfter(e, { type: e.type, ...TYPES[e.type].mirror({ ...e.p }) });
function select(id) {
  if (ED.placing && ED.placing.id !== id) cancelPlacing();
  ED.sel = id; refresh();
  document.querySelector(`#list [data-id="${id}"]`)?.scrollIntoView({ block: 'nearest' });
}
function flash(msg) { ED.msg = msg; refresh(); clearTimeout(flash.t); flash.t = setTimeout(() => { ED.msg = ''; refresh(); }, 3000); }
function setMode(edit) {
  ED.on = edit; ED.drag = null; ED.hover = null;
  release(); HAND.on = false;
  if (!edit) cancelPlacing();
  canvas.classList.toggle('editing', edit); canvas.style.cursor = '';
  canvas.title = edit ? 'click a part to select it · drag to move it' : 'drag a part to turn it · space to pause';
  refresh();
}

// ---- the panel ----
const rgb = c => `rgb(${c.map(Math.round).join(',')})`;
const swatch = type => `<i class="swatch" style="background:${rgb(TYPES[type].color)};color:${rgb(TYPES[type].color)}"></i>`;
const fmt = (v, step) => step < 1 ? (+v).toFixed(step < .1 ? 2 : 1) : String(Math.round(v));
for (const T of Object.values(TYPES)) {
  const b = document.createElement('button');
  b.innerHTML = swatch(T.type) + T.label; b.title = T.hint;
  b.onclick = () => ED.placing && ED.placing.type === T.type ? cancelPlacing() : addPart(T.type);
  T.btn = b; $('adds').append(b);
}
let ctl = {}; // the selected part's controls, by param
function renderInspector() {
  const box = $('inspector'), e = selected();
  ED.shown = ED.sel; ctl = {};
  if (!e) { box.innerHTML = '<h2>Selected</h2><p class="empty">Click a part in the scene to edit it, or add a new one above.</p>'; return; }
  const T = TYPES[e.type];
  box.innerHTML = `<h2>${swatch(e.type)}${T.label} <small>#${e.id}</small></h2><p class="hint">${T.hint}</p><div class="fields"></div>
    <div class="row"><button id="dup" title="Duplicate (⌘D)">Duplicate</button><button id="mir" title="Mirrored copy across the center (M)">Mirror</button><button id="del" class="danger" title="Delete (⌫)">Delete</button></div>`;
  const fields = box.querySelector('.fields');
  for (const f of [num('x', 'x', 0, W - 1), num('y', 'y', 0, H - 1), ...T.fields]) {
    const row = document.createElement(f.options ? 'div' : 'label');
    row.className = 'f'; row.innerHTML = `<span title="${f.label}">${f.label}</span>`;
    if (f.options) {
      const seg = document.createElement('div'), btns = [];
      seg.className = 'seg';
      for (const [v, text] of f.options) {
        const b = document.createElement('button');
        b.textContent = text; b.onclick = () => { setParam(e, f.key, v); record(); };
        btns.push([v, b]); seg.append(b);
      }
      row.append(seg); ctl[f.key] = { f, btns };
    } else {
      const inp = Object.assign(document.createElement('input'), { type: 'range', min: f.min, max: f.max, step: f.step });
      const out = document.createElement('output');
      inp.oninput = () => { setParam(e, f.key, +inp.value); out.textContent = fmt(inp.value, f.step); syncRow(e); };
      inp.onchange = record;
      row.append(inp, out); ctl[f.key] = { f, inp, out };
    }
    fields.append(row);
  }
  $('dup').onclick = () => duplicate(e);
  $('mir').onclick = () => mirror(e);
  $('del').onclick = () => removePart(e);
  syncInspector();
}
function syncInspector() {
  const e = selected();
  if (!e) return;
  for (const { f, inp, out, btns } of Object.values(ctl)) {
    const v = e.p[f.key];
    if (btns) for (const [bv, b] of btns) b.classList.toggle('on', bv === v);
    else { if (document.activeElement !== inp) inp.value = v; out.textContent = fmt(v, f.step); }
  }
}
function renderList() {
  const ul = $('list');
  ul.textContent = '';
  $('count').textContent = parts.length;
  for (const e of parts) {
    const li = document.createElement('li'), b = document.createElement('button');
    b.dataset.id = e.id; b.className = e.id === ED.sel ? 'sel' : '';
    b.innerHTML = `${swatch(e.type)}<span class="name">${TYPES[e.type].label}</span><span class="xy">${e.p.x}, ${e.p.y}</span>`;
    b.onclick = () => select(e.id);
    b.onmouseenter = () => { ED.hover = e.id; };
    b.onmouseleave = () => { if (ED.hover === e.id) ED.hover = null; };
    li.append(b); ul.append(li);
  }
}
function syncRow(e) { const r = document.querySelector(`#list [data-id="${e.id}"] .xy`); if (r) r.textContent = `${e.p.x}, ${e.p.y}`; }
function syncXY(e) {
  syncRow(e);
  if (e.id === ED.sel) for (const k of ['x', 'y']) if (ctl[k]) { ctl[k].inp.value = e.p[k]; ctl[k].out.textContent = e.p[k]; }
}
function refresh() {
  renderList();
  if (ED.shown !== ED.sel) renderInspector(); else syncInspector();
  for (const T of Object.values(TYPES)) T.btn.classList.toggle('on', ED.placing?.type === T.type);
  for (const b of $('mode').children) b.classList.toggle('on', (b.dataset.mode === 'edit') === ED.on);
  $('undo').disabled = hist.i <= 0; $('redo').disabled = hist.i >= hist.list.length - 1;
  $('pause').textContent = paused ? '▶' : '❚❚'; $('pause').title = paused ? 'Play (space)' : 'Pause (space)';
  $('hint').innerHTML = ED.msg || (ED.placing ? `Click the scene to place the <b>${TYPES[ED.placing.type].label}</b> · Esc cancels`
    : ED.on ? 'Pick a part to add, then click the scene to place it.' : 'Hand mode: drag a machine to turn it.');
}
// panel buttons shouldn't keep focus, so the keyboard keeps working on the scene
document.querySelector('.panel').addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
for (const b of $('mode').children) b.onclick = () => setMode(b.dataset.mode === 'edit');
$('pause').onclick = () => togglePause();
$('undo').onclick = undo;
$('redo').onclick = redo;
$('export').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(sceneList(), null, 1)], { type: 'application/json' }));
  a.download = 'cascade-scene.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('import').onclick = () => $('file').click();
$('file').onchange = async () => {
  const f = $('file').files[0];
  $('file').value = '';
  if (!f) return;
  try {
    const list = JSON.parse(await f.text());
    if (!Array.isArray(list)) throw new Error('not a list');
    cancelPlacing();
    loadScene(list.filter(o => o && TYPES[o.type] && Number.isFinite(o.x) && Number.isFinite(o.y)));
    ED.sel = null; record();
  } catch { flash('That file isn’t a cascade scene.'); }
};
$('reset').onclick = () => { cancelPlacing(); loadScene(DEFAULT_SCENE); record(); flash('Back to the original temple · ⌘Z to undo'); };
$('clear').onclick = () => { cancelPlacing(); loadScene([]); ED.sel = null; record(); flash('Cleared · ⌘Z to undo'); };

const params = new URLSearchParams(location.search);
if (params.has('only')) { const want = params.get('only').split(','); layers.forEach(L => L.on = want.includes(L.name)); }

// the scene saved in this browser, or the original temple (?fresh starts from the original)
let saved = null;
try { saved = JSON.parse(localStorage.getItem(STORE)); } catch {}
loadScene(Array.isArray(saved) && !params.has('fresh') ? saved.filter(o => o && TYPES[o.type]) : DEFAULT_SCENE);

// pre-run the world a few seconds so the water is already flowing on load
let clock = +(params.get('t') || 6);
simT = Math.max(0, clock - 6);
drawOn = false;
while (simT + DT <= clock) { simT += DT; temple.update(simT); simStep(); }
drawOn = true; temple.update(simT);

let paused = false, last = performance.now();
function loop(now) {
  if (!paused) clock += Math.min(.1, (now - last) / 1000);
  last = now;
  if (!paused) frame(clock);
  else if (ED.on) { temple.update(simT); frame(clock); } // paused: still show parts being moved and edited
  requestAnimationFrame(loop);
}
const togglePause = () => { paused = !paused; refresh(); };
const toCanvas = e => { const r = canvas.getBoundingClientRect(); return [clamp(Math.round((e.clientX - r.left) / r.width * W), 0, W - 1), clamp(Math.round((e.clientY - r.top) / r.height * H), 0, H - 1)]; };
canvas.addEventListener('pointermove', e => {
  if (!e.isPrimary) return;
  const [x, y] = toCanvas(e);
  [HAND.tx, HAND.ty] = [x, y];
  if (ED.on) {
    ED.last = [x, y];
    const d = ED.drag;
    if (ED.placing) moveTo(ED.placing, x, y);
    else if (d) { moveTo(d.e, x - d.ox, y - d.oy); d.moved = true; }
    else { const h = pickAt(x, y); ED.hover = h ? h.id : null; canvas.style.cursor = h ? 'grab' : ''; }
    return;
  }
  if (!HAND.on) { HAND.on = true; HAND.x = HAND.tx; HAND.y = HAND.ty; HAND.vx = HAND.vy = 0; }
});
canvas.addEventListener('pointerleave', () => { if (ED.on) ED.hover = null; else if (!HAND.down) HAND.on = false; });
canvas.addEventListener('pointerdown', e => {
  if (!e.isPrimary) return;
  document.activeElement?.blur();
  canvas.setPointerCapture(e.pointerId);
  const [x, y] = toCanvas(e);
  [HAND.tx, HAND.ty] = [x, y];
  if (!ED.on) { press(); return; }
  if (ED.placing) { moveTo(ED.placing, x, y); ED.placing = null; record(); return; }
  const h = pickAt(x, y);
  select(h ? h.id : null);
  if (h) { ED.drag = { e: h, ox: x - h.p.x, oy: y - h.p.y, moved: false }; canvas.style.cursor = 'grabbing'; }
});
// a finger has no hover, so the hand goes away when it lifts
const lift = e => {
  if (!e.isPrimary) return;
  if (ED.on) { if (ED.drag?.moved) record(); ED.drag = null; canvas.style.cursor = ''; return; }
  release(); if (e.pointerType !== 'mouse') HAND.on = false;
};
canvas.addEventListener('pointerup', lift);
canvas.addEventListener('pointercancel', lift);
addEventListener('keydown', e => {
  if (document.activeElement?.tagName === 'INPUT') return;
  const cmd = e.metaKey || e.ctrlKey, k = e.key.length === 1 ? e.key.toLowerCase() : e.key, sel = selected();
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  else if (cmd && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (cmd && k === 'y') { e.preventDefault(); redo(); }
  else if (cmd && k === 'd') { if (sel) { e.preventDefault(); duplicate(sel); } }
  else if (cmd || e.altKey) return;
  else if (k === 'e') setMode(!ED.on);
  else if (k === 'Escape') { if (ED.placing) cancelPlacing(); else select(null); }
  else if (!ED.on || !sel || ED.placing) return;
  else if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); removePart(sel); }
  else if (k === 'm') mirror(sel);
  else if (k.startsWith('Arrow')) {
    e.preventDefault();
    const n = e.shiftKey ? 10 : 1;
    moveTo(sel, sel.p.x + (k === 'ArrowLeft' ? -n : k === 'ArrowRight' ? n : 0), sel.p.y + (k === 'ArrowUp' ? -n : k === 'ArrowDown' ? n : 0));
    ED.nudged = true;
  }
});
addEventListener('keyup', e => { if (ED.nudged && e.key.startsWith('Arrow')) { ED.nudged = false; record(); } });

record();
requestAnimationFrame(loop);
</script>
</body>
