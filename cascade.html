<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cascade Mandala</title>
<style>
  :root { --bg: #0b0f1c; --panel: rgba(12, 16, 34, .86); --ink: #cfd6f2; --dim: #6c7598; --on: #7fe0ff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 12px/1.4 ui-monospace, Menlo, monospace; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas {
    height: min(96vh, calc(96vw * 1.25));
    aspect-ratio: 360 / 450;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    box-shadow: 0 0 60px rgba(90, 120, 255, .25);
    cursor: pointer;
  }
  #panel { position: fixed; top: 12px; left: 12px; background: var(--panel); border: 1px solid #262d4e; border-radius: 6px; padding: 8px 10px; user-select: none; }
  #panel.hidden { display: none; }
  #panel .hd { color: var(--dim); margin-bottom: 6px; }
  #panel ul { list-style: none; margin: 0; padding: 0; }
  #panel li { cursor: pointer; padding: 1px 0; white-space: nowrap; }
  #panel li .k { color: var(--dim); display: inline-block; width: 1.6em; }
  #panel li .b { display: inline-block; width: 1.4em; color: var(--on); }
  #panel li.off { color: var(--dim); }
  #panel li.off .b { color: var(--dim); }
  #panel li:hover { color: #fff; }
</style>
</head>
<body>
<canvas id="c" title="click / space to pause"></canvas>
<div id="panel">
  <div class="hd">layers · click toggle · shift-click solo<br>1–0 keys · space pause · L hide</div>
  <ul id="list"></ul>
</div>
<script>
const W = 360, H = 450, CX = 180, N = W * H * 4;
const POOL = 404; // water surface of the lake
const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d');
const img = ctx.createImageData(W, H);
const O = img.data; // composited output
let T = null;       // layer buffer currently being drawn into

// ---------- utils ----------
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const lerp = (a, b, k) => a + (b - a) * k;
const lerpC = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smooth = (a, b, v) => { const k = clamp((v - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); };
const mod = (a, n) => ((a % n) + n) % n;
const MX = x => 2 * CX - x; // mirror across the center column

function h2(x, y) {
  let n = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = h2(xi, yi), b = h2(xi + 1, yi), c = h2(xi, yi + 1), d = h2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, y) => vnoise(x, y) * .5 + vnoise(x * 2.1, y * 2.1) * .3 + vnoise(x * 4.3, y * 4.3) * .2;
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => v / 16 - .5);

// "over" blend into the current layer buffer (straight alpha)
function mix(x, y, c, a = 1) {
  x |= 0; y |= 0;
  if (x < 0 || y < 0 || x >= W || y >= H || a <= 0) return;
  const i = (y * W + x) << 2, oa = T[i + 3] / 255;
  if (a >= 1 || oa === 0) { T[i] = c[0]; T[i + 1] = c[1]; T[i + 2] = c[2]; T[i + 3] = (a > 1 ? 1 : a) * 255; return; }
  const na = a + oa * (1 - a), k = a / na;
  T[i] += (c[0] - T[i]) * k; T[i + 1] += (c[1] - T[i + 1]) * k; T[i + 2] += (c[2] - T[i + 2]) * k; T[i + 3] = na * 255;
}
const put = (x, y, c) => mix(x, y, c, 1);
function line(x0, y0, x1, y1, c, a) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (let n = 0; n < 2000; n++) {
    mix(x0, y0, c, a);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}

// ---------- palette ----------
const C = {
  ink: hex('#07070d'), inkRim: hex('#2a2f48'), shine: hex('#c8d0e8'), gold: hex('#ffe9a8'),
  navy: hex('#13205e'), deep: hex('#0d1640'), white: hex('#f4f6ff'), mist: hex('#e2e8ff'),
  stone0: hex('#1a2560'), stone1: hex('#26368a'), stone2: hex('#3a52b8'), stoneTop: hex('#9fb4ff'),
  purple: hex('#6d4fc0'), purpleLt: hex('#c9a6ff'), purpleDk: hex('#3a2a8a'), purpleEdge: hex('#a07ae8'),
  foam: hex('#f4fcff'),
};
const WATER = ['#1f4fb8', '#2f78d8', '#5cb4f0', '#93dcff', '#c8f0ff', '#f4fcff', '#7fe8e0'].map(hex);
const WATER_FAR = ['#7f8fd8', '#a3b0ea', '#c7cff4', '#e8ecff'].map(hex);
const RAIN = ['#c9f2e2', '#9fe3d8', '#bfe9f5', '#d2c4f5', '#b9a6ec', '#f0f4ff', '#f3c6dc', '#86c9ee', '#5fd3be', '#e8f7b0', '#a8b8f4'].map(hex);
const TILE = ['#2fd3c0', '#1e48c8', '#8f5ae6', '#f39a3c', '#3bb6f0', '#5ee08a', '#e75fa8'].map(hex);
const CIRC = ['#1d47c9', '#f08d2e', '#9b52e0', '#e9f4ff', '#1f2e7a', '#ffd84a'].map(hex);
const SILVER = ['#5d6582', '#aeb6cc', '#e4e8f2', '#8a92ac'].map(hex);
const GEM_TOP = ['#e8fff0', '#bff7c8', '#7fe8a0', '#3fc78a', '#9af0d0'].map(hex);
const GEM_SIDE = ['#ff9ae8', '#ff5fd0', '#c040e0', '#7a3ae0', '#3a6af0'].map(hex);
const GEM_LIP = ['#ffd0e0', '#ff7fa8', '#ff4f88', '#5fd6d6', '#2a9fc0'].map(hex);

// ============================================================
// STRUCTURE GEOMETRY — shared by the structure layer (drawing),
// the collision mask (water physics) and the ornament layer.
// ============================================================
const D1 = { x: CX, y: 150, r: 50 };            // great central diamond
const S0 = { x: CX, y: 30, r: 16 };             // crown spring
const G  = { x: CX, y: 228, r: 18 };            // curtain gem
const LIP = { x0: CX - 22, x1: CX + 22, y0: 246, y1: 252 }; // curtain lip
const BASIN = { x0: CX - 30, x1: CX + 30, y0: 332, y1: 338 };
const SIDE = [-1, 1].map(s => {
  const X = x => s < 0 ? x : MX(x);
  return {
    s,
    spring: { x: X(40), y: 50, r: 11 },
    d2: { x: X(40), y: 120, r: 22 },
    l1: { x0: Math.min(X(96), X(140)), x1: Math.max(X(96), X(140)), y0: 232, y1: 237 },
    l2: { x0: Math.min(X(50), X(86)), x1: Math.max(X(50), X(86)), y0: 290, y1: 295 },
  };
});

const mask = new Uint8Array(W * H);
const solid = (x, y) => x < 0 || x >= W || y >= H ? 1 : y < 0 ? 0 : mask[y * W + x];
function fillDiamond(d, color) {
  for (let dy = -d.r; dy <= d.r; dy++) {
    const w = d.r - Math.abs(dy);
    for (let dx = -w; dx <= w; dx++) {
      const x = d.x + dx, y = d.y + dy;
      if (x < 0 || x >= W || y < 0 || y >= H) continue;
      mask[y * W + x] = 1;
      if (color) put(x, y, color(dx, dy, d.r - Math.abs(dx) - Math.abs(dy)));
    }
  }
}
function fillRect(r, color) {
  for (let y = r.y0; y <= r.y1; y++) for (let x = r.x0; x <= r.x1; x++) {
    if (x < 0 || x >= W || y < 0 || y >= H) continue;
    mask[y * W + x] = 1;
    if (color) put(x, y, color(x - r.x0, y - r.y0, r.x1 - r.x0, r.y1 - r.y0));
  }
}

// ============================================================
// LAYERS (back → front)
// ============================================================
const layers = [];
function layer(name, opts) {
  const L = { name, on: true, buf: opts.post ? null : new Uint8ClampedArray(N), ...opts };
  if (L.static) { T = L.buf; L.draw(0); } // static layers render once, right away (structure also fills the mask)
  layers.push(L); return L;
}

// ---- 1. sky ----------------------------------------------------
const skyBase = new Uint8ClampedArray(N);
(function buildSky() {
  T = skyBase;
  const stops = [[0, '#0a1450'], [120, '#1d3a9c'], [220, '#4f6fd0'], [285, '#a49ae0'], [335, '#f0bfc4']].map(s => [s[0], hex(s[1])]);
  for (let y = 0; y < H; y++) {
    let c = stops[stops.length - 1][1];
    for (let s = 0; s < stops.length - 1; s++) {
      if (y >= stops[s][0] && y < stops[s + 1][0]) { c = lerpC(stops[s][1], stops[s + 1][1], (y - stops[s][0]) / (stops[s + 1][0] - stops[s][0])); break; }
    }
    for (let x = 0; x < W; x++) {
      const d = BAYER[(y & 3) * 4 + (x & 3)] * 10, i = (y * W + x) << 2;
      T[i] = Math.floor((c[0] + d) / 6) * 6; T[i + 1] = Math.floor((c[1] + d) / 6) * 6; T[i + 2] = Math.floor((c[2] + d) / 6) * 6; T[i + 3] = 255;
    }
  }
  const cTop = hex('#fbe6cc'), cBot = hex('#e9a89c'), cRim = hex('#cdb6e6');
  for (let y = 258; y < 340; y++) for (let x = 0; x < W; x++) {
    const v = fbm(x * .022, y * .09) - .55 + smooth(20, 150, Math.abs(x - CX)) * .2;
    if (v > 0) mix(x, y, v < .025 ? cRim : lerpC(cTop, cBot, (y - 258) / 82), clamp(v * 9, .35, .9));
  }
})();
const stars = Array.from({ length: 80 }, (_, i) => ({ x: Math.floor(h2(i, 1) * W), y: Math.floor(h2(i, 2) * 260), ph: h2(i, 3) * 6.28, sp: 1 + h2(i, 4) * 3 }));
layer('sky', { draw(t) {
  T.set(skyBase);
  for (const s of stars) mix(s.x, s.y, C.white, .2 + .6 * Math.max(0, Math.sin(t * s.sp + s.ph)));
} });

// ---- 2. mountains ----------------------------------------------
const ridge = x => 338 - 56 * Math.exp(-(((x - 40) / 32) ** 2)) - 44 * Math.exp(-(((x - 322) / 34) ** 2))
  - 18 * Math.exp(-(((x - 214) / 45) ** 2)) - 14 * Math.exp(-(((x - 128) / 30) ** 2)) - fbm(x * .08, 3) * 10;
const hillTop = x => Math.round(366 + 5 * Math.sin(x * .035) + 4 * Math.sin(x * .083 + 2) - fbm(x * .05, 9) * 9);
layer('mountains', { static: true, draw() {
  const R = rng(11);
  const lit = hex('#7b97e6'), shd = hex('#3b5cc0'), snowL = hex('#f3f6ff'), snowS = hex('#b9c8f0'), haze = hex('#9fb2e8');
  for (let x = 0; x < W; x++) {
    const r = Math.round(ridge(x)), facingLeft = ridge(x + 1) - ridge(x - 1) < 0;
    const snowLine = 312 + vnoise(x * .2, 0) * 10;
    for (let y = r; y < 380; y++) {
      let c = facingLeft ? lit : shd;
      if (vnoise(x * .6, y * .08) > .62) c = lerpC(c, snowS, .35);
      if (y < snowLine && vnoise(x * .7, y * .1) > .32) c = facingLeft ? snowL : snowS;
      put(x, y, lerpC(c, haze, clamp((y - r) / 50, 0, 1) * .3));
    }
  }
  const hill = hex('#2b4bb0'), hillDk = hex('#1d3790'), rim = hex('#5b82dc');
  for (let x = 0; x < W; x++) {
    const r = hillTop(x);
    put(x, r, rim);
    for (let y = r + 1; y < POOL; y++) put(x, y, lerpC(hill, hillDk, (y - r) / 30));
  }
  function pine(x, base, h, c, hl) {
    for (let k = 0; k < h; k++) {
      let hw = Math.floor(k * .36) - ((k % 4) === 0 && k > 2 ? 1 : 0);
      if (hw < 0) hw = 0;
      for (let dx = -hw; dx <= hw; dx++) put(x + dx, base - h + k, hl && dx === -hw && k > 1 ? hl : c);
    }
  }
  for (let x = -4; x < W + 4; x += 3 + Math.floor(R() * 4)) pine(x, 396 + Math.round(vnoise(x * .1, 1) * 4), 8 + Math.floor(R() * 10), hex('#1c3a8a'), hex('#2f53a8'));
  for (let x = -4; x < W + 4; x += 4 + Math.floor(R() * 5)) pine(x, POOL, 10 + Math.floor(R() * 16), hex('#0c1d4a'), hex('#1d5576'));
} });

// ---- 3. far falls: thin distant cascades down the mountain faces ----
const farFalls = [22, 44, 58, 302, 318, 334, 124, 236].map((x, i) => ({ x, top: Math.round(ridge(x)) + 4, w: i < 6 ? 2 : 1, ph: h2(i, 21) * 40 }));
layer('far falls', { draw(t) {
  for (const f of farFalls) {
    const bottom = hillTop(f.x) + 1;
    for (let y = f.top; y < bottom; y++) {
      const v = mod(Math.floor((y - f.top) * .5 - t * 14 + f.ph), 12);
      const c = v < 2 ? WATER_FAR[3] : v < 6 ? WATER_FAR[2] : WATER_FAR[1];
      const a = .75 * smooth(f.top, f.top + 6, y);
      for (let o = 0; o < f.w; o++) mix(f.x + o + Math.round(Math.sin(y * .15 + f.ph) * .6), y, c, a);
    }
    for (let k = 0; k < 6; k++) mix(f.x - 2 + k, bottom - 1 - (k & 1), WATER_FAR[3], .35 + .25 * Math.sin(t * 6 + k));
  }
} });

// ---- 4. pixel rain: shimmering curtains behind the temple ----------
const PL = 256;
const rain = [];
(function buildRain() {
  const R = rng(3);
  for (let x = 0; x < W; x++) {
    const pat = new Uint8Array(PL), dens = x % 2 === 0 ? .7 : .35;
    let p = 0;
    while (p < PL) {
      if (R() < dens) { const len = 1 + Math.floor(R() * 5), ci = 1 + Math.floor(R() * RAIN.length); for (let k = 0; k < len && p < PL; k++) pat[p++] = ci; p++; }
      else p += 1 + Math.floor(R() * 3);
    }
    const end = 250 + Math.floor(fbm(x * .07, 5) * 60 + R() * 20);
    rain.push({ pat, end, sp: R() < .2 ? 0 : 8 + R() * 22, ph: R() * PL, a: x % 2 === 0 ? .5 : .3 });
  }
})();
layer('pixel rain', { draw(t) {
  for (let x = 0; x < W; x++) {
    const col = rain[x], off = Math.floor(t * col.sp + col.ph);
    for (let y = 0; y < col.end; y++) {
      const ci = col.pat[mod(y - off, PL)];
      if (ci) mix(x, y, RAIN[ci - 1], y < col.end - 50 ? col.a : col.a * (col.end - y) / 50);
    }
  }
} });

// ---- 5. structure: everything solid that water can land on ----------
layer('structure', { static: true, draw() {
  const stoneDiamond = (dx, dy, edge) => edge < 1 ? C.ink : edge < 3 ? C.stoneTop : (Math.abs(dx) + Math.abs(dy)) % 6 === 0 ? C.stone2 : C.stone1;
  const stoneRect = (x, y, w, h) => y === 0 ? C.stoneTop : y === h ? C.ink : (x === 0 || x === w) ? C.ink : y === 1 ? C.stone2 : ((x + 2) % 8 < 2 ? C.stone0 : C.stone1);
  fillDiamond(D1, stoneDiamond);
  fillDiamond(S0, stoneDiamond);
  fillDiamond(G, stoneDiamond);
  fillRect(LIP, stoneRect);
  fillRect(BASIN, stoneRect);
  for (const sd of SIDE) {
    fillDiamond(sd.spring, stoneDiamond);
    fillDiamond(sd.d2, stoneDiamond);
    fillRect(sd.l1, stoneRect);
    fillRect(sd.l2, stoneRect);
  }
  // basin rim posts
  for (const x of [BASIN.x0, BASIN.x1]) for (let y = BASIN.y1 + 1; y < POOL; y++) for (let q = -1; q <= 1; q++) put(x + q * Math.sign(CX - x) + Math.sign(CX - x) * 2, y, q === 0 ? C.stone1 : C.stone0);
} });

// ---- 6. ornaments: animated jewelry on top of the structure ----------
const circ = new Uint8Array((D1.r + 1) * (D1.r + 1));
(function buildCircuit() {
  const R = rng(42), CELL = 4, n = Math.ceil((D1.r + 1) / CELL);
  for (let gy = 0; gy < n; gy++) for (let gx = 0; gx < n; gx++) {
    const top = R() < .5, left = R() < .5, dot = R() < .3, col = 1 + Math.floor(R() * CIRC.length);
    for (let ly = 0; ly < CELL; ly++) for (let lx = 0; lx < CELL; lx++) {
      const dx = gx * CELL + lx, dy = gy * CELL + ly;
      if (dx > D1.r || dy > D1.r) continue;
      if ((top && ly === 0) || (left && lx === 0) || (dot && lx === 2 && ly === 2)) circ[dy * (D1.r + 1) + dx] = col;
    }
  }
})();
const BEAD = ['.XXX.', 'XHXXX', 'XXXXX', 'XXXXr', '.XrX.'];
let beadIdx = 0;
function bead(x, y, t) {
  const i = beadIdx++, glint = mod(i * .29 - t * 1.4, 7) < .35;
  for (let r = 0; r < 5; r++) for (let q = 0; q < 5; q++) {
    const ch = BEAD[r][q];
    if (ch !== '.') put(x + q - 2, y + r - 2, ch === 'X' ? C.ink : ch === 'r' ? C.inkRim : glint ? C.gold : C.shine);
  }
}
function beadPath(pts, t, spacing = 4) {
  for (let s = 0; s < pts.length - 1; s++) {
    const [x0, y0] = pts[s], [x1, y1] = pts[s + 1];
    const n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / spacing));
    for (let k = 0; k < n; k++) bead(Math.round(lerp(x0, x1, k / n)), Math.round(lerp(y0, y1, k / n)), t);
  }
}
const diamondPts = (cx, cy, r) => [[cx, cy - r], [cx + r, cy], [cx, cy + r], [cx - r, cy], [cx, cy - r]];

function gem(d, t, pal, inset = 0) {
  const r = d.r - inset, sheen = Math.floor(t * 40), inner = (r - 5) * .75;
  for (let dy = -r; dy <= r; dy++) {
    const w = r - Math.abs(dy);
    for (let dx = -w; dx <= w; dx++) {
      const ax = Math.abs(dx), ay = Math.abs(dy), edge = r - ax - ay, m = Math.max(ax, ay);
      let c;
      if (edge < 1) c = C.ink;
      else if (edge < 4) { c = SILVER[edge - 1]; if (mod(dx - dy + sheen, 80) < 5) c = C.white; }
      else if (edge < 5) c = C.deep;
      else if (m <= inner) { c = m < 2 ? C.white : pal[mod((m >> 1) - Math.floor(t * 4), pal.length)]; if (m === Math.floor(inner)) c = C.deep; }
      else c = ((ax + ay) & 1) ? hex('#7d8fc0') : hex('#a8b8e0');
      put(d.x + dx, d.y + dy, c);
    }
  }
}
const EYE = ['..xxxxx..', '.xwwbwwx.', 'xwwbpbwwx', '.xwwbwwx.', '..xxxxx..'];
function eye(cx, cy, t, seed) {
  const blink = mod(t + seed * 1.7, 5.3) < .14;
  const look = Math.round(Math.sin(t * .7 + seed) * 1.2);
  const col = { x: C.ink, w: C.white, b: hex('#3fb8e0'), p: C.ink };
  for (let r = 0; r < 5; r++) for (let q = 0; q < 9; q++) {
    let ch = EYE[r][q];
    if (ch === '.') continue;
    if (blink) { if (r === 2) put(cx + q - 4, cy, C.ink); continue; }
    if ((ch === 'b' || ch === 'p') && (q + look < 2 || q + look > 6)) ch = 'w';
    put(cx + q - 4 + ((ch === 'b' || ch === 'p') ? look : 0), cy + r - 2, col[ch]);
  }
}
function tileDiamond(d, t, seed) {
  for (let dy = -d.r; dy <= d.r; dy++) {
    const w = d.r - Math.abs(dy);
    for (let dx = -w; dx <= w; dx++) {
      const ax = Math.abs(dx), ay = Math.abs(dy), edge = d.r - ax - ay, m = Math.max(ax, ay);
      let c;
      if (edge < 2) c = C.navy;
      else if (m <= 5) c = C.white;
      else if (m <= d.r * .55) c = m % 3 === 0 ? C.deep : TILE[mod((m >> 1) - Math.floor(t * 2) + seed, 7)];
      else c = TILE[mod((edge >> 1) + Math.floor(t * 1.3) + seed + 3, 7)];
      put(d.x + dx, d.y + dy, c);
    }
  }
}
function pillar(x, y0, y1, t) {
  const off = Math.floor(t * 8);
  for (let y = y0; y < y1; y++) {
    for (let q = -3; q <= 3; q++) mix(x + q, y, Math.abs(q) === 3 ? C.purpleEdge : C.purple, .85);
    const ry = mod(y + off, 7);
    if (ry < 5) for (let q = -2; q <= 2; q++) {
      const ring = (ry === 0 || ry === 4) ? Math.abs(q) < 2 : Math.abs(q) === 2;
      if (ring) put(x + q, y, C.purpleLt);
      else if (ry === 2 && q === 0) put(x, y, C.purpleDk);
    }
  }
}
layer('ornaments', { draw(t) {
  beadIdx = 0;
  // purple bead pillars holding up the lower ledges
  for (const sd of SIDE) {
    pillar(sd.s < 0 ? 72 : MX(72), 0, 290, t);
    pillar(sd.s < 0 ? 118 : MX(118), 0, 232, t);
  }
  // great diamond: living circuit face, eye at its heart
  const wave = mod(t * 22, D1.r + 24), inset = 4, r = D1.r - inset;
  for (let dy = -r; dy <= r; dy++) {
    const ay = Math.abs(dy), w = r - ay;
    for (let dx = -w; dx <= w; dx++) {
      const ax = Math.abs(dx), d = ax + ay, edge = r - d;
      let c;
      if (edge < 1) c = C.deep;
      else {
        const v = circ[ay * (D1.r + 1) + ax];
        c = v ? CIRC[mod(v - 1 + Math.floor(t * 1.5 - d / 8), CIRC.length)] : d % 12 === 0 ? hex('#1a3f9a') : ((d >> 2) & 1) ? hex('#35b096') : hex('#2fa48e');
        if (Math.abs(d - wave) < 2) c = lerpC(c, C.white, v ? .7 : .35);
      }
      put(D1.x + dx, D1.y + dy, c);
    }
  }
  for (let dy = -9; dy <= 9; dy++) for (let dx = -9; dx <= 9; dx++) {
    const rr = Math.hypot(dx, dy);
    if (rr <= 8.5) put(D1.x + dx, D1.y + dy, rr > 7.5 ? C.ink : hex('#0b1440'));
  }
  eye(D1.x, D1.y, t, 0);
  beadPath(diamondPts(D1.x, D1.y, D1.r + 7), t);

  gem(S0, t, GEM_TOP, 2);
  gem(G, t, GEM_LIP, 2);
  beadPath([[LIP.x0, LIP.y1 + 3], [LIP.x1, LIP.y1 + 3]], t);
  for (const sd of SIDE) {
    gem(sd.spring, t, GEM_SIDE, 1);
    tileDiamond({ ...sd.d2, r: sd.d2.r - 3 }, t, sd.s < 0 ? 0 : 3);
    eye(sd.d2.x, sd.d2.y, t, sd.s * 2);
    beadPath(diamondPts(sd.d2.x, sd.d2.y, sd.d2.r + 6), t);
    // light chasing along the ledge faces
    for (const l of [sd.l1, sd.l2]) {
      const len = l.x1 - l.x0, p = mod(Math.floor(t * 30), len * 2);
      for (let k = 0; k < 3; k++) mix(l.x0 + mod(p - k, len), l.y0 + 3, C.gold, 1 - k * .3);
    }
  }
} });

// ---- 7. cascades: water that falls, lands on the structure, runs, and spills ----
// Each stream is traced pixel-by-pixel through the collision mask:
//   fall straight down → if blocked, slip diagonally → else run along the ledge → spill off the end.
// Streams that run into an earlier stream merge into it and make it wider downstream.
const streams = [];
const owner = new Int32Array(W * H).fill(-1);
function traceStream(x, y, w, dir0) {
  const id = streams.length;
  const s = { id, w, xs: [], ys: [], kind: [], dir: [], tau: [], width: [], impacts: [], pat: new Uint8Array(64), seed: id * 13 + 7 };
  streams.push(s);
  let dir = dir0 || (x < CX ? -1 : x > CX ? 1 : 1), tau = 0, run = 0, falling = true, moved = 0;
  for (let step = 0; step < 4000; step++) {
    if (y >= POOL) { s.impacts.push({ i: s.xs.length - 1, pool: true }); break; }
    const o = owner[y * W + x];
    if (o >= 0 && o !== id) {
      // join the other stream: it gets wider from here on
      const other = streams[o], k = other.ownerIdx.get(y * W + x);
      for (let j = k; j < other.width.length; j++) other.width[j] = Math.min(11, other.width[j] + s.w);
      break;
    }
    owner[y * W + x] = id;
    s.xs.push(x); s.ys.push(y); s.tau.push(tau); s.width.push(w);
    s.kind.push(falling ? 0 : 1); s.dir.push(moved ? dir : 0);
    if (!solid(x, y + 1)) {
      if (!falling) run = 0;
      falling = true; run++; y++;
      tau += 1 / Math.min(4.5, 1 + run * .07);           // water accelerates as it falls
    } else {
      if (falling) s.impacts.push({ i: s.xs.length - 1, pool: false });
      falling = false; moved = 1;
      if (!solid(x + dir, y + 1)) { x += dir; y++; }
      else if (!solid(x + dir, y)) { x += dir; }
      else if (!solid(x - dir, y)) { dir = -dir; x += dir; }
      else break;
      tau += 1.3;
    }
  }
  s.ownerIdx = new Map();
  for (let j = 0; j < s.xs.length; j++) s.ownerIdx.set(s.ys[j] * W + s.xs[j], j);
  const R = rng(s.seed);
  for (let p = 0; p < 64;) {               // streak pattern: runs of shades with foam flecks
    const len = 2 + Math.floor(R() * 6), c = R() < .12 ? 5 : R() < .35 ? 4 : 1 + Math.floor(R() * 3);
    for (let k = 0; k < len && p < 64; k++) s.pat[p++] = c;
  }
  return s;
}
// merges only ever target streams that have finished tracing, so ownerIdx is always ready
const addStream = traceStream;
(function buildStreams() {
  // crown spring splits on the apex of the great diamond
  addStream(CX - 3, S0.y + S0.r + 1, 5, -1);
  addStream(CX + 3, S0.y + S0.r + 1, 5, 1);
  for (const sd of SIDE) {
    addStream(sd.spring.x - 2, sd.spring.y + sd.spring.r + 1, 3, -1);
    addStream(sd.spring.x + 2, sd.spring.y + sd.spring.r + 1, 3, 1);
  }
  // the chandelier curtain from under the lip
  for (let dx = -20; dx <= 20; dx += 2) if (dx) addStream(CX + dx, LIP.y1 + 1, 2, dx < 0 ? -1 : 1);
})();

const SPEED = 34; // flow speed in path units / sec
function drawStream(s, t) {
  const n = s.xs.length, base = s.seed * 5;
  for (let i = 0; i < n; i++) {
    const x = s.xs[i], y = s.ys[i], w = s.width[i], v = s.tau[i] - t * SPEED;
    if (s.kind[i] === 0) {
      // falling sheet: horizontal span, extending away from the lip it left
      const d = s.dir[i], x0 = d < 0 ? x - w + 1 : d > 0 ? x : x - (w >> 1);
      for (let o = 0; o < w; o++) {
        const ci = s.pat[mod(Math.floor(v * .8) + Math.floor(h2(o, base) * 64), 64)];
        let c = WATER[ci];
        const edge = o === 0 || o === w - 1;
        if (i > 0 && s.kind[i - 1] === 1) c = C.foam;         // lip foam
        mix(x0 + o, y, c, edge && w > 2 ? .55 : .92);
      }
    } else {
      // running water: a sheet riding on top of the ledge, or hugging the outside of a slope
      const slope = i > 0 && s.ys[i - 1] !== y, d = s.dir[i] || 1;
      const th = slope ? 2 + Math.min(2, w >> 1) : 1 + Math.min(2, w >> 2);
      for (let k = 0; k < th; k++) {
        const ci = s.pat[mod(Math.floor(v) + k * 17, 64)];
        const c = k === th - 1 ? lerpC(WATER[ci], C.foam, .35) : WATER[ci], a = k === th - 1 ? .7 : .95;
        if (slope) { mix(x + d * k, y, c, a); mix(x + d * k, y - 1, c, a * .8); }
        else mix(x, y - k, c, a);
      }
    }
  }
}
function drawSplash(s, imp, t) {
  const x = s.xs[imp.i], y = s.ys[imp.i], w = s.width[imp.i], n = 3 + w * (imp.pool ? 2 : 1);
  for (let k = 0; k < n; k++) {
    const seed = s.id * 97 + imp.i * 7 + k, per = .45 + h2(seed, 1) * .5;
    const u = mod(t / per + h2(seed, 2), 1);
    const vx = (h2(seed, 3) - .5) * (imp.pool ? 26 : 16), vy = 10 + h2(seed, 4) * (imp.pool ? 22 : 12);
    const px = x + vx * u, py = y - vy * u + 34 * u * u;
    mix(px, py, C.foam, (1 - u) * .9);
  }
}
layer('cascades', { draw(t) {
  for (const s of streams) drawStream(s, t);
  for (const s of streams) for (const imp of s.impacts) if (!imp.pool) drawSplash(s, imp, t);
} });

// ---- 8. lake: mirrors everything composited above it ----
const lakeDark = hex('#0a1a48');
layer('lake', { post(t) {
  for (let y = POOL; y < H; y++) {
    const k = y - POOL, src = POOL - 1 - k, off = Math.round(Math.sin(y * .7 + t * 2) * (1 + k * .06));
    for (let x = 0; x < W; x++) {
      const sx = clamp(x + off, 0, W - 1), si = (src * W + sx) << 2, i = (y * W + x) << 2;
      O[i] = O[si] * .55 + lakeDark[0] * .45; O[i + 1] = O[si + 1] * .55 + lakeDark[1] * .45; O[i + 2] = O[si + 2] * .55 + lakeDark[2] * .45;
      if (h2(x >> 1, y * 13 + Math.floor(t * 5)) > .985) { O[i] = O[i] * .4 + 150; O[i + 1] = O[i + 1] * .4 + 155; O[i + 2] = O[i + 2] * .4 + 160; }
    }
  }
  for (let x = 0; x < W; x++) { const i = (POOL * W + x) << 2; O[i] = O[i] * .5 + 110; O[i + 1] = O[i + 1] * .5 + 120; O[i + 2] = O[i + 2] * .5 + 128; }
} });

// ---- 9. spray & mist where the falls meet the lake ----
layer('spray', { draw(t) {
  for (let y = 372; y < POOL; y++) {
    const prof = Math.sin(Math.PI * (y - 372) / 32);
    for (let x = 0; x < W; x++) mix(x, y, C.mist, .2 * prof * fbm((x + t * 6) * .04, y * .15));
  }
  for (const s of streams) for (const imp of s.impacts) {
    if (!imp.pool) continue;
    const x = s.xs[imp.i], w = s.width[imp.i], d = s.dir[imp.i];
    const cx = x + (d < 0 ? -(w >> 1) : d > 0 ? w >> 1 : 0);
    drawSplash(s, imp, t);
    for (let k = 0; k < 2; k++) {                          // ripple rings
      const r = mod(t * 9 + k * 7 + s.id, 14), a = (1 - r / 14) * .55;
      for (let ang = 0; ang < Math.PI * 2; ang += .08) mix(cx + Math.cos(ang) * (r * 1.4 + w * .5), POOL + 2 + Math.sin(ang) * r * .3, C.white, a);
    }
    for (let k = 0; k < 10; k++) {                          // churning mist puff
      const px = cx + (h2(k, s.id + Math.floor(t * 8)) - .5) * (w + 10), py = POOL - h2(k + 50, s.id + Math.floor(t * 8)) * 9;
      mix(px, py, C.mist, .35);
    }
  }
} });

// ---- 10. glitch: occasional horizontal slip ----
const glitch = { until: 0, y0: 0, h: 0, dx: 0 };
const rowTmp = new Uint8ClampedArray(W * 4);
layer('glitch', { post(t) {
  if (t > glitch.until && Math.random() < .008) {
    glitch.y0 = Math.floor(Math.random() * (H - 20)); glitch.h = 3 + Math.floor(Math.random() * 12);
    glitch.dx = (Math.random() < .5 ? -1 : 1) * (3 + Math.floor(Math.random() * 10)); glitch.until = t + .12 + Math.random() * .15;
  }
  if (t >= glitch.until) return;
  for (let y = glitch.y0; y < glitch.y0 + glitch.h; y++) {
    rowTmp.set(O.subarray(y * W * 4, (y + 1) * W * 4));
    for (let x = 0; x < W; x++) {
      const sx = mod(x - glitch.dx, W), i = (y * W + x) << 2;
      O[i] = rowTmp[mod(sx - 2, W) * 4]; O[i + 1] = rowTmp[sx * 4 + 1]; O[i + 2] = rowTmp[sx * 4 + 2];
    }
  }
} });

// ============================================================
// COMPOSITOR
// ============================================================
function blend(S) {
  for (let i = 0; i < N; i += 4) {
    const a = S[i + 3];
    if (a === 0) continue;
    if (a === 255) { O[i] = S[i]; O[i + 1] = S[i + 1]; O[i + 2] = S[i + 2]; continue; }
    const k = a / 255;
    O[i] += (S[i] - O[i]) * k; O[i + 1] += (S[i + 1] - O[i + 1]) * k; O[i + 2] += (S[i + 2] - O[i + 2]) * k;
  }
}
function frame(t) {
  for (let i = 0; i < N; i += 4) { O[i] = 11; O[i + 1] = 15; O[i + 2] = 28; O[i + 3] = 255; }
  for (const L of layers) {
    if (!L.on) continue;
    if (L.post) { L.post(t); continue; }
    if (!L.static) { T = L.buf; T.fill(0); L.draw(t); }
    blend(L.buf);
  }
  ctx.putImageData(img, 0, 0);
}

// ---------- layer panel ----------
const list = document.getElementById('list');
function renderPanel() {
  list.innerHTML = '';
  layers.forEach((L, i) => {
    const li = document.createElement('li');
    li.className = L.on ? '' : 'off';
    li.innerHTML = `<span class="k">${(i + 1) % 10}</span><span class="b">${L.on ? '■' : '□'}</span>${L.name}`;
    li.onclick = e => {
      if (e.shiftKey) { const solo = layers.every((M, j) => M.on === (j === i)); layers.forEach((M, j) => M.on = solo || j === i); }
      else L.on = !L.on;
      renderPanel();
    };
    list.appendChild(li);
  });
}
renderPanel();
const params = new URLSearchParams(location.search);
if (params.has('only')) { const want = params.get('only').split(','); layers.forEach(L => L.on = want.includes(L.name)); renderPanel(); }

let paused = false, last = performance.now(), clock = +(params.get('t') || 0);
function loop(now) {
  if (!paused) clock += Math.min(.1, (now - last) / 1000);
  last = now;
  if (!paused) frame(clock);
  requestAnimationFrame(loop);
}
const toggle = () => { paused = !paused; };
canvas.addEventListener('click', toggle);
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'l' || e.key === 'L') document.getElementById('panel').classList.toggle('hidden');
  else if (/^[0-9]$/.test(e.key)) { const L = layers[(+e.key + 9) % 10]; if (L) { L.on = !L.on; renderPanel(); } }
});
requestAnimationFrame(loop);
</script>
</body>
</html>
