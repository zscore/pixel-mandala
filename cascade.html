<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cascade Mandala</title>
<style>
  :root { --bg: #0b0f1c; --panel: rgba(12, 16, 34, .86); --ink: #cfd6f2; --dim: #6c7598; --on: #7fe0ff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 12px/1.4 ui-monospace, Menlo, monospace; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas {
    height: min(96vh, calc(96vw * 1.25));
    aspect-ratio: 360 / 450;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    box-shadow: 0 0 60px rgba(90, 120, 255, .25);
    cursor: pointer;
  }
  #panel { position: fixed; top: 12px; left: 12px; background: var(--panel); border: 1px solid #262d4e; border-radius: 6px; padding: 8px 10px; user-select: none; }
  #panel.hidden { display: none; }
  #panel .hd { color: var(--dim); margin-bottom: 6px; }
  #panel ul { list-style: none; margin: 0; padding: 0; }
  #panel li { cursor: pointer; padding: 1px 0; white-space: nowrap; }
  #panel li .k { color: var(--dim); display: inline-block; width: 1.6em; }
  #panel li .b { display: inline-block; width: 1.4em; color: var(--on); }
  #panel li.off { color: var(--dim); }
  #panel li.off .b { color: var(--dim); }
  #panel li:hover { color: #fff; }
  #panel .stat { color: var(--dim); margin-top: 6px; }
</style>
</head>
<body>
<canvas id="c" title="click / space to pause"></canvas>
<div id="panel">
  <div class="hd">layers · click toggle · shift-click solo<br>1–0 keys · space pause · L hide</div>
  <ul id="list"></ul>
  <div class="stat" id="stat"></div>
</div>
<script>
const W = 360, H = 450, CX = 180, N = W * H * 4;
const POOL = 404; // water surface of the lake
const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d');
const img = ctx.createImageData(W, H);
const O = img.data; // composited output
let T = null;       // layer buffer currently being drawn into
let drawOn = true;  // false on simulation steps that won't be shown: shapes only write the collision mask

// ---------- utils ----------
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const lerp = (a, b, k) => a + (b - a) * k;
const lerpC = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smooth = (a, b, v) => { const k = clamp((v - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); };
const mod = (a, n) => ((a % n) + n) % n;
const MX = x => 2 * CX - x; // mirror across the center column

function h2(x, y) {
  let n = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = h2(xi, yi), b = h2(xi + 1, yi), c = h2(xi, yi + 1), d = h2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, y) => vnoise(x, y) * .5 + vnoise(x * 2.1, y * 2.1) * .3 + vnoise(x * 4.3, y * 4.3) * .2;
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => v / 16 - .5);

// "over" blend into the current layer buffer (straight alpha)
function mix(x, y, c, a = 1) {
  x |= 0; y |= 0;
  if (x < 0 || y < 0 || x >= W || y >= H || a <= 0) return;
  const i = (y * W + x) << 2, oa = T[i + 3] / 255;
  if (a >= 1 || oa === 0) { T[i] = c[0]; T[i + 1] = c[1]; T[i + 2] = c[2]; T[i + 3] = (a > 1 ? 1 : a) * 255; return; }
  const na = a + oa * (1 - a), k = a / na;
  T[i] += (c[0] - T[i]) * k; T[i + 1] += (c[1] - T[i + 1]) * k; T[i + 2] += (c[2] - T[i + 2]) * k; T[i + 3] = na * 255;
}
const put = (x, y, c) => mix(x, y, c, 1);
function line(x0, y0, x1, y1, c, a) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (let n = 0; n < 2000; n++) {
    mix(x0, y0, c, a);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}

// ---------- palette ----------
const C = {
  ink: hex('#07070d'), inkRim: hex('#2a2f48'), shine: hex('#c8d0e8'), gold: hex('#ffe9a8'),
  navy: hex('#13205e'), deep: hex('#0d1640'), white: hex('#f4f6ff'), mist: hex('#e2e8ff'), ley: hex('#f2e85a'),
  stone0: hex('#1a2560'), stone1: hex('#26368a'), stone2: hex('#3a52b8'), stoneTop: hex('#9fb4ff'),
  purple: hex('#6d4fc0'), purpleLt: hex('#c9a6ff'), purpleDk: hex('#3a2a8a'), purpleEdge: hex('#a07ae8'),
  foam: hex('#f4fcff'), facet0: hex('#7d8fc0'), facet1: hex('#a8b8e0'), pupil: hex('#3fb8e0'),
  guide: hex('#1a3f9a'), jade0: hex('#35b096'), jade1: hex('#2fa48e'), well: hex('#0b1440'),
};
const WATER = ['#1f4fb8', '#2f78d8', '#4a9ae8', '#5cb4f0', '#93dcff', '#c8f0ff', '#f4fcff'].map(hex);
const WATER_FAR = ['#7f8fd8', '#a3b0ea', '#c7cff4', '#e8ecff'].map(hex);
const RAIN = ['#c9f2e2', '#9fe3d8', '#bfe9f5', '#d2c4f5', '#b9a6ec', '#f0f4ff', '#f3c6dc', '#86c9ee', '#5fd3be', '#e8f7b0', '#a8b8f4'].map(hex);
const TILE = ['#2fd3c0', '#1e48c8', '#8f5ae6', '#f39a3c', '#3bb6f0', '#5ee08a', '#e75fa8'].map(hex);
const CIRC = ['#1d47c9', '#f08d2e', '#9b52e0', '#e9f4ff', '#1f2e7a', '#ffd84a'].map(hex);
const SILVER = ['#5d6582', '#aeb6cc', '#e4e8f2', '#8a92ac'].map(hex);
const GEM_TOP = ['#e8fff0', '#bff7c8', '#7fe8a0', '#3fc78a', '#9af0d0'].map(hex);
const GEM_SIDE = ['#ff9ae8', '#ff5fd0', '#c040e0', '#7a3ae0', '#3a6af0'].map(hex);
const GEM_LIP = ['#ffd0e0', '#ff7fa8', '#ff4f88', '#5fd6d6', '#2a9fc0'].map(hex);

// ============================================================
// SHAPES — every piece of the temple is a shape in its own local
// coordinates, rasterized each frame with a rotation and a "phase"
// (1 = solid, 0 = gone, in between = ordered-dither dissolve).
// Solid shapes also write the collision mask the water reads.
// ============================================================
const mask = new Uint8Array(W * H);
function raster(x0, y0, ang, R, col, phase = 1, isSolid = true) {
  if (phase <= 0) return;
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const xa = Math.max(0, Math.floor(x0 - R)), xb = Math.min(W - 1, Math.ceil(x0 + R));
  const ya = Math.max(0, Math.floor(y0 - R)), yb = Math.min(H - 1, Math.ceil(y0 + R));
  for (let y = ya; y <= yb; y++) for (let x = xa; x <= xb; x++) {
    if (phase < 1 && phase <= BAYER[(y & 3) * 4 + (x & 3)] + .5) continue;
    const dx = x - x0, dy = y - y0, c = col(dx * ca + dy * sa, -dx * sa + dy * ca);
    if (!c) continue;
    if (isSolid) mask[y * W + x] = 1;
    if (drawOn) put(x, y, c);
  }
}
const toScreen = (x0, y0, ang, u, v) => [x0 + u * Math.cos(ang) - v * Math.sin(ang), y0 + u * Math.sin(ang) + v * Math.cos(ang)];
// 1 while present → dissolves out → stays gone → dissolves back in
function cycle(t, period, offset, gone = .25, fade = .12) {
  const u = mod(t / period + offset, 1), on = 1 - gone - 2 * fade;
  if (u < on) return 1;
  if (u < on + fade) return 1 - (u - on) / fade;
  if (u < on + fade + gone) return 0;
  return (u - on - fade - gone) / fade;
}
const edgeD = (u, v, r) => r + .35 - Math.abs(u) - Math.abs(v); // distance inside a diamond's edge

const stoneDiamond = r => (u, v) => {
  const e = edgeD(u, v, r);
  if (e < 0) return null;
  return e < 1 ? C.ink : e < 3 ? C.stoneTop : Math.round(Math.abs(u) + Math.abs(v)) % 6 === 0 ? C.stone2 : C.stone1;
};
const stoneRect = (hw, hh) => (u, v) => {
  if (Math.abs(u) > hw + .5 || Math.abs(v) > hh + .5) return null;
  const x = Math.round(u + hw), y = Math.round(v + hh);
  return y <= 0 ? C.stoneTop : y >= 2 * hh ? C.ink : (x <= 0 || x >= 2 * hw) ? C.ink : y === 1 ? C.stone2 : ((x + 2) % 8 < 2 ? C.stone0 : C.stone1);
};
const gemShape = (r, pal, t) => {
  const sheen = Math.floor(t * 40), inner = (r - 5) * .75, spin = Math.floor(t * 4);
  return (u, v) => {
    const e = edgeD(u, v, r);
    if (e < 0) return null;
    const ei = Math.floor(e), m = Math.round(Math.max(Math.abs(u), Math.abs(v)));
    if (ei < 1) return C.ink;
    if (ei < 4) return mod(Math.round(u - v) + sheen, 80) < 5 ? C.white : SILVER[ei - 1];
    if (ei < 5) return C.deep;
    if (m <= inner) return m === Math.floor(inner) ? C.deep : m < 2 ? C.white : pal[mod((m >> 1) - spin, pal.length)];
    return Math.round(Math.abs(u) + Math.abs(v)) & 1 ? C.facet0 : C.facet1;
  };
};
const tileShape = (r, t, seed) => {
  const a = Math.floor(t * 2), b = Math.floor(t * 1.3);
  return (u, v) => {
    const e = edgeD(u, v, r);
    if (e < 0) return null;
    const m = Math.round(Math.max(Math.abs(u), Math.abs(v)));
    if (e < 2) return C.navy;
    if (m <= Math.max(1, r * .3)) return C.white;
    if (m <= r * .55) return m % 3 === 0 ? C.deep : TILE[mod((m >> 1) - a + seed, 7)];
    return TILE[mod((Math.floor(e) >> 1) + b + seed + 3, 7)];
  };
};
// a cup: floor plus two walls, pivoting about its middle
const cupShape = (hw, depth) => (u, v) => {
  const au = Math.abs(u);
  if (au > hw + .5) return null;
  if (v >= 0 && v <= 5.5) return v < 1 ? C.stoneTop : v > 4.5 ? C.ink : (Math.round(u) + 2) % 8 < 2 ? C.stone0 : C.stone1;
  if (v < 0 && v >= -depth && au >= hw - 3.5) return (au >= hw - .5 || v < -depth + 1) ? C.stoneTop : C.stone2;
  return null;
};

// great diamond face: a circuit maze (one quadrant, mirrored four ways)
const D1 = { x: CX, y: 150, r: 50 };
const circ = new Uint8Array((D1.r + 1) * (D1.r + 1));
(function buildCircuit() {
  const R = rng(42), CELL = 4, n = Math.ceil((D1.r + 1) / CELL);
  for (let gy = 0; gy < n; gy++) for (let gx = 0; gx < n; gx++) {
    const top = R() < .5, left = R() < .5, dot = R() < .3, col = 1 + Math.floor(R() * CIRC.length);
    for (let ly = 0; ly < CELL; ly++) for (let lx = 0; lx < CELL; lx++) {
      const dx = gx * CELL + lx, dy = gy * CELL + ly;
      if (dx > D1.r || dy > D1.r) continue;
      if ((top && ly === 0) || (left && lx === 0) || (dot && lx === 2 && ly === 2)) circ[dy * (D1.r + 1) + dx] = col;
    }
  }
})();
const greatDiamond = t => {
  const r = D1.r, wave = mod(t * 22, r + 24), shift = t * 1.5;
  return (u, v) => {
    const e = edgeD(u, v, r);
    if (e < 0) return null;
    if (e < 1) return C.ink;
    if (e < 3) return C.stoneTop;
    if (e < 4.5) return C.deep;
    const rr = u * u + v * v;
    if (rr < 73) return rr > 57 ? C.ink : C.well;
    const ax = Math.min(r, Math.round(Math.abs(u))), ay = Math.min(r, Math.round(Math.abs(v))), d = ax + ay;
    const cv = circ[ay * (r + 1) + ax];
    let c = cv ? CIRC[mod(cv - 1 + Math.floor(shift - d / 8), CIRC.length)] : d % 12 === 0 ? C.guide : ((d >> 2) & 1) ? C.jade0 : C.jade1;
    if (Math.abs(d - wave) < 2) c = lerpC(c, C.white, cv ? .7 : .35);
    return c;
  };
};

// ---------- small sprites ----------
const BEAD = ['.XXX.', 'XHXXX', 'XXXXX', 'XXXXr', '.XrX.'];
let beadIdx = 0;
function bead(x, y, t) {
  x = Math.round(x); y = Math.round(y);
  const i = beadIdx++, glint = mod(i * .29 - t * 1.4, 7) < .35;
  for (let r = 0; r < 5; r++) for (let q = 0; q < 5; q++) {
    const ch = BEAD[r][q];
    if (ch !== '.') put(x + q - 2, y + r - 2, ch === 'X' ? C.ink : ch === 'r' ? C.inkRim : glint ? C.gold : C.shine);
  }
}
function beadPath(pts, t, spacing = 4) {
  for (let s = 0; s < pts.length - 1; s++) {
    const [x0, y0] = pts[s], [x1, y1] = pts[s + 1];
    const n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / spacing));
    for (let k = 0; k < n; k++) bead(lerp(x0, x1, k / n), lerp(y0, y1, k / n), t);
  }
}
const diamondRing = (x, y, r, ang) => [[0, -r], [r, 0], [0, r], [-r, 0], [0, -r]].map(([u, v]) => toScreen(x, y, ang, u, v));
const EYE = ['..xxxxx..', '.xwwbwwx.', 'xwwbpbwwx', '.xwwbwwx.', '..xxxxx..'];
function eye(cx, cy, t, seed) {
  const blink = mod(t + seed * 1.7, 5.3) < .14, look = Math.round(Math.sin(t * .7 + seed) * 1.2);
  const col = { x: C.ink, w: C.white, b: C.pupil, p: C.ink };
  for (let r = 0; r < 5; r++) for (let q = 0; q < 9; q++) {
    let ch = EYE[r][q];
    if (ch === '.') continue;
    if (blink) { if (r === 2) put(cx + q - 4, cy, C.ink); continue; }
    if ((ch === 'b' || ch === 'p') && (q + look < 2 || q + look > 6)) ch = 'w';
    put(cx + q - 4 + ((ch === 'b' || ch === 'p') ? look : 0), cy + r - 2, col[ch]);
  }
}
function pillar(x, y0, y1, t) {
  const off = Math.floor(t * 8);
  for (let y = y0; y < y1; y++) {
    for (let q = -3; q <= 3; q++) mix(x + q, y, Math.abs(q) === 3 ? C.purpleEdge : C.purple, .85);
    const ry = mod(y + off, 7);
    if (ry < 5) for (let q = -2; q <= 2; q++) {
      const ring = (ry === 0 || ry === 4) ? Math.abs(q) < 2 : Math.abs(q) === 2;
      if (ring) put(x + q, y, C.purpleLt);
      else if (ry === 2 && q === 0) put(x, y, C.purpleDk);
    }
  }
}

// ============================================================
// LAYERS (back → front)
//   update(t): runs every frame even when hidden (physics, collision mask)
//   draw(t):   only when visible
//   post(t):   operates on the composite so far
// ============================================================
const layers = [];
function layer(name, opts) {
  const L = { name, on: true, buf: opts.post ? null : new Uint8ClampedArray(N), ...opts };
  if (L.static) { T = L.buf; L.draw(0); }
  layers.push(L); return L;
}

// ---- sky ----------------------------------------------------
const skyBase = new Uint8ClampedArray(N);
(function buildSky() {
  T = skyBase;
  const stops = [[0, '#0a1450'], [120, '#1d3a9c'], [220, '#4f6fd0'], [285, '#a49ae0'], [335, '#f0bfc4']].map(s => [s[0], hex(s[1])]);
  for (let y = 0; y < H; y++) {
    let c = stops[stops.length - 1][1];
    for (let s = 0; s < stops.length - 1; s++) {
      if (y >= stops[s][0] && y < stops[s + 1][0]) { c = lerpC(stops[s][1], stops[s + 1][1], (y - stops[s][0]) / (stops[s + 1][0] - stops[s][0])); break; }
    }
    for (let x = 0; x < W; x++) {
      const d = BAYER[(y & 3) * 4 + (x & 3)] * 10, i = (y * W + x) << 2;
      T[i] = Math.floor((c[0] + d) / 6) * 6; T[i + 1] = Math.floor((c[1] + d) / 6) * 6; T[i + 2] = Math.floor((c[2] + d) / 6) * 6; T[i + 3] = 255;
    }
  }
  const cTop = hex('#fbe6cc'), cBot = hex('#e9a89c'), cRim = hex('#cdb6e6');
  for (let y = 258; y < 340; y++) for (let x = 0; x < W; x++) {
    const v = fbm(x * .022, y * .09) - .55 + smooth(20, 150, Math.abs(x - CX)) * .2;
    if (v > 0) mix(x, y, v < .025 ? cRim : lerpC(cTop, cBot, (y - 258) / 82), clamp(v * 9, .35, .9));
  }
})();
const stars = Array.from({ length: 80 }, (_, i) => ({ x: Math.floor(h2(i, 1) * W), y: Math.floor(h2(i, 2) * 260), ph: h2(i, 3) * 6.28, sp: 1 + h2(i, 4) * 3 }));
layer('sky', { draw(t) {
  T.set(skyBase);
  for (const s of stars) mix(s.x, s.y, C.white, .2 + .6 * Math.max(0, Math.sin(t * s.sp + s.ph)));
} });

// ---- mountains ----------------------------------------------
const ridge = x => 338 - 56 * Math.exp(-(((x - 40) / 32) ** 2)) - 44 * Math.exp(-(((x - 322) / 34) ** 2))
  - 18 * Math.exp(-(((x - 214) / 45) ** 2)) - 14 * Math.exp(-(((x - 128) / 30) ** 2)) - fbm(x * .08, 3) * 10;
const hillTop = x => Math.round(366 + 5 * Math.sin(x * .035) + 4 * Math.sin(x * .083 + 2) - fbm(x * .05, 9) * 9);
layer('mountains', { static: true, draw() {
  const R = rng(11);
  const lit = hex('#7b97e6'), shd = hex('#3b5cc0'), snowL = hex('#f3f6ff'), snowS = hex('#b9c8f0'), haze = hex('#9fb2e8');
  for (let x = 0; x < W; x++) {
    const r = Math.round(ridge(x)), facingLeft = ridge(x + 1) - ridge(x - 1) < 0;
    const snowLine = 312 + vnoise(x * .2, 0) * 10;
    for (let y = r; y < 380; y++) {
      let c = facingLeft ? lit : shd;
      if (vnoise(x * .6, y * .08) > .62) c = lerpC(c, snowS, .35);
      if (y < snowLine && vnoise(x * .7, y * .1) > .32) c = facingLeft ? snowL : snowS;
      put(x, y, lerpC(c, haze, clamp((y - r) / 50, 0, 1) * .3));
    }
  }
  const hill = hex('#2b4bb0'), hillDk = hex('#1d3790'), rim = hex('#5b82dc');
  for (let x = 0; x < W; x++) {
    const r = hillTop(x);
    put(x, r, rim);
    for (let y = r + 1; y < POOL; y++) put(x, y, lerpC(hill, hillDk, (y - r) / 30));
  }
  function pine(x, base, h, c, hl) {
    for (let k = 0; k < h; k++) {
      let hw = Math.floor(k * .36) - ((k % 4) === 0 && k > 2 ? 1 : 0);
      if (hw < 0) hw = 0;
      for (let dx = -hw; dx <= hw; dx++) put(x + dx, base - h + k, hl && dx === -hw && k > 1 ? hl : c);
    }
  }
  for (let x = -4; x < W + 4; x += 3 + Math.floor(R() * 4)) pine(x, 396 + Math.round(vnoise(x * .1, 1) * 4), 8 + Math.floor(R() * 10), hex('#1c3a8a'), hex('#2f53a8'));
  for (let x = -4; x < W + 4; x += 4 + Math.floor(R() * 5)) pine(x, POOL, 10 + Math.floor(R() * 16), hex('#0c1d4a'), hex('#1d5576'));
} });

// ---- far falls: thin distant cascades down the mountain faces ----
const farFalls = [22, 44, 58, 302, 318, 334, 124, 236].map((x, i) => ({ x, top: Math.round(ridge(x)) + 4, w: i < 6 ? 2 : 1, ph: h2(i, 21) * 40 }));
layer('far falls', { draw(t) {
  for (const f of farFalls) {
    const bottom = hillTop(f.x) + 1;
    for (let y = f.top; y < bottom; y++) {
      const v = mod(Math.floor((y - f.top) * .5 - t * 14 + f.ph), 12);
      const c = v < 2 ? WATER_FAR[3] : v < 6 ? WATER_FAR[2] : WATER_FAR[1];
      const a = .75 * smooth(f.top, f.top + 6, y);
      for (let o = 0; o < f.w; o++) mix(f.x + o + Math.round(Math.sin(y * .15 + f.ph) * .6), y, c, a);
    }
    for (let k = 0; k < 6; k++) mix(f.x - 2 + k, bottom - 1 - (k & 1), WATER_FAR[3], .35 + .25 * Math.sin(t * 6 + k));
  }
} });

// ---- pixel rain: shimmering curtains behind the temple ----------
const PL = 256;

  { x: 34, y: 372, r: 13, pal: GEM_SIDE, spin: .5, off: 0 },
  { x: 326, y: 360, r: 15, pal: GEM_TOP, spin: -.4, off: .5 },
  { x: 300, y: 430, r: 9, pal: GEM_LIP, spin: .7, off: .25 },
  { x: 62, y: 436, r: 8, pal: GEM_TOP, spin: -.8, off: .75 },
];
layer('foreground', { draw(t) {
  starPoly(D1.x, D1.y, 136, 8, 3, t * .07, C.ley, .45 * cycle(t, 16, 0, .3, .2));
  starPoly(D1.x, D1.y, 108, 12, 5, -t * .11, C.purpleLt, .4 * cycle(t, 16, .5, .3, .2));
  // halo of spinning tiles; a wave of appearance travels around the ring
  for (let k = 0; k < 12; k++) {
    const a = -t * .16 + k * Math.PI / 6;
    const ph = clamp(Math.sin(t * 1.1 - k * Math.PI / 3) * 1.6 + .2, 0, 1);
    raster(D1.x + Math.cos(a) * 128, D1.y + Math.sin(a) * 118, t * 1.4 + k, 9, tileShape(6, t, k), ph, false);
  }
  for (const c of CRYSTALS) {
    const x = c.x + Math.sin(t * .4 + c.off * 6) * 6, y = c.y + Math.cos(t * .3 + c.off * 6) * 4;
    raster(x, y, t * c.spin, c.r * 1.05, gemShape(c.r, c.pal, t), cycle(t, 12, c.off, .35, .15), false);
  }
} });

// ---- glitch: occasional horizontal slip ----
const glitch = { until: 0, y0: 0, h: 0, dx: 0 };
const rowTmp = new Uint8ClampedArray(W * 4);
layer('glitch', { post(t) {
  if (t > glitch.until && Math.random() < .008) {
    glitch.y0 = Math.floor(Math.random() * (H - 20)); glitch.h = 3 + Math.floor(Math.random() * 12);
    glitch.dx = (Math.random() < .5 ? -1 : 1) * (3 + Math.floor(Math.random() * 10)); glitch.until = t + .12 + Math.random() * .15;
  }
  if (t >= glitch.until) return;
  for (let y = glitch.y0; y < glitch.y0 + glitch.h; y++) {
    rowTmp.set(O.subarray(y * W * 4, (y + 1) * W * 4));
    for (let x = 0; x < W; x++) {
      const sx = mod(x - glitch.dx, W), i = (y * W + x) << 2;
      O[i] = rowTmp[mod(sx - 2, W) * 4]; O[i + 1] = rowTmp[sx * 4 + 1]; O[i + 2] = rowTmp[sx * 4 + 2];
    }
  }
} });

// ============================================================
// COMPOSITOR + FIXED-STEP SIMULATION
// ============================================================
function blend(S) {
  for (let i = 0; i < N; i += 4) {
    const a = S[i + 3];
    if (a === 0) continue;
    if (a === 255) { O[i] = S[i]; O[i + 1] = S[i + 1]; O[i + 2] = S[i + 2]; continue; }
    const k = a / 255;
    O[i] += (S[i] - O[i]) * k; O[i + 1] += (S[i + 1] - O[i + 1]) * k; O[i + 2] += (S[i + 2] - O[i + 2]) * k;
  }
}
const temple = layers.find(L => L.name === 'temple');
let simT = 0;
function advance(t) {
  // world moves in fixed 1/60s steps so the water behaves the same at any frame rate
  const n = Math.min(3, Math.floor((t - simT) / DT));
  for (let k = 0; k < n; k++) { simT += DT; drawOn = k === n - 1; temple.update(simT); simStep(); }
  drawOn = true;
  if (simT + DT <= t) simT = t; // fell behind (tab was hidden): skip ahead
}
function frame(t) {
  advance(t);
  for (let i = 0; i < N; i += 4) { O[i] = 11; O[i + 1] = 15; O[i + 2] = 28; O[i + 3] = 255; }
  for (const L of layers) {
    if (!L.on) continue;
    if (L.post) { L.post(t); continue; }
    if (!L.static && !L.update) { T = L.buf; T.fill(0); L.draw(t); }
    blend(L.buf);
  }
  ctx.putImageData(img, 0, 0);
}

// ---------- layer panel ----------
const list = document.getElementById('list'), stat = document.getElementById('stat');
function renderPanel() {
  list.innerHTML = '';
  layers.forEach((L, i) => {
    const li = document.createElement('li');
    li.className = L.on ? '' : 'off';
    li.innerHTML = `<span class="k">${(i + 1) % 10}</span><span class="b">${L.on ? '■' : '□'}</span>${L.name}`;
    li.onclick = e => {
      if (e.shiftKey) { const solo = layers.every((M, j) => M.on === (j === i)); layers.forEach((M, j) => M.on = solo || j === i); }
      else L.on = !L.on;
      renderPanel();
    };
    list.appendChild(li);
  });
}
renderPanel();
const params = new URLSearchParams(location.search);
if (params.has('only')) { const want = params.get('only').split(','); layers.forEach(L => L.on = want.includes(L.name)); renderPanel(); }

// pre-run the world a few seconds so the water is already flowing on load
let clock = +(params.get('t') || 6);
simT = Math.max(0, clock - 6);
drawOn = false;
while (simT + DT <= clock) { simT += DT; temple.update(simT); simStep(); }
drawOn = true; temple.update(simT);

let paused = false, last = performance.now(), statT = 0;
function loop(now) {
  if (!paused) clock += Math.min(.1, (now - last) / 1000);
  last = now;
  if (!paused) frame(clock);
  if (now - statT > 500) { stat.textContent = `${streams.length} streams · basin ${Math.round(cup.fill * 100)}%`; statT = now; }
  requestAnimationFrame(loop);
}
const toggle = () => { paused = !paused; };
canvas.addEventListener('click', toggle);
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'l' || e.key === 'L') document.getElementById('panel').classList.toggle('hidden');
  else if (/^[0-9]$/.test(e.key)) { const L = layers[(+e.key + 9) % 10]; if (L) { L.on = !L.on; renderPanel(); } }
});
requestAnimationFrame(loop);
</script>
